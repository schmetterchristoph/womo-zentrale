<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Womo Zentrale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0a0f15;--panel:#121a23;--panel2:#18232f;--line:#243241;--text:#e9eff5;--mute:#8697ab;
  --blue:#3ba3ff;--green:#34c38f;--yellow:#ffc233;--orange:#ff8a3d;--red:#ff4d5e;--cyan:#3fd2e0;--violet:#a98bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);display:grid;grid-template-columns:92px 1fr;grid-template-rows:64px 1fr}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .4s}
/* Navigation */
nav{grid-row:1/3;background:#070b10;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px}
nav button{width:76px;height:55px;border:0;border-radius:16px;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-family:inherit;cursor:pointer}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--panel2);color:var(--blue)}
/* Kopfzeile */
header{display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line)}
header .veh{font-size:20px;font-weight:650;letter-spacing:.2px}
header .place{color:var(--mute);font-size:15px}
header .sp{flex:1}
header .wx{display:flex;align-items:center;gap:8px;font-size:18px}
header .wx svg{width:34px;height:34px}
header .clock{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
header .date{color:var(--mute);font-size:13px;text-align:right;line-height:1.2}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.dot.ok{background:var(--green)}
.badge{background:var(--red);color:#fff;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600}
.badge.warn{background:var(--orange)}
main{position:relative;overflow:hidden}
.page{position:absolute;inset:0;padding:18px 22px;display:none}
.page.on{display:block}
/* Bausteine */
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;position:relative}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.big{font-size:44px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.u{font-size:.55em;color:var(--mute);font-weight:500;margin-left:3px}
.mute{color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:17px}
.kv>:nth-child(odd){color:var(--mute)}
.kv>:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:550}
.row{display:flex;align-items:center;gap:12px}
.btn{border:0;border-radius:14px;background:var(--panel2);color:var(--text);font-family:inherit;font-size:18px;font-weight:600;line-height:1;padding:0 18px;height:58px;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line)}
.btn.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sel.red{background:var(--red);border-color:var(--red)}
.btn.sel.green{background:var(--green);border-color:var(--green)}
.btn:disabled{opacity:.35}
.btn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22)}
.btn.holding .fill{width:100%;transition:width .9s linear}
.btn span{position:relative}
.hint{font-size:13px;color:var(--mute)}
.bar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.empty{color:var(--mute);font-size:18px;padding:30px;text-align:center}
.scroll{overflow-y:auto;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
/* Start-Grafik */
.fl .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12;animation:flow 1s linear infinite}
.fl .flow.rev{animation-direction:reverse}
.fl .flow.off{opacity:0;animation:none}
@keyframes flow{to{stroke-dashoffset:-28}}
.fl text{font-family:inherit;font-variant-numeric:tabular-nums}
.ring{transform:rotate(-90deg);transform-origin:50% 50%}
/* Tanks */
.tank{width:120px;height:230px;border-radius:18px;border:2px solid var(--line);background:var(--panel2);position:relative;overflow:hidden;margin:0 auto}
.tank>i{position:absolute;left:0;right:0;bottom:0;background:var(--blue);transition:height .6s}
.tank>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:650;text-shadow:0 1px 6px #000a}
/* Tabelle */
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child{color:var(--mute);word-break:break-all}
td:last-child{text-align:right}
.devlist button{display:block;width:100%;text-align:left;margin-bottom:6px;height:auto;padding:10px 12px;font-size:15px;font-weight:500}
input[type=text]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:17px;padding:0 14px;user-select:text}
input[type=range]{width:100%;height:40px;accent-color:var(--blue)}
.warnbox{background:rgba(255,138,61,.12);border:1px solid var(--orange);color:#ffd2b5;border-radius:14px;padding:10px 14px;font-size:16px}
.demo{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--orange);opacity:.8}

/* Startseite im HUD-Stil */
#stage.full header{display:none}
#stage.full main{grid-row:1/3}
#pg-start{padding:0}
.hudsvg text{font-family:"Rajdhani","Arial Narrow",system-ui,sans-serif}
.hudsvg .net line{stroke:#38e8ff;stroke-opacity:.12}
.hudsvg .net circle{fill:#5fe9ff;opacity:.4}
.floorGrid line{stroke:#38e8ff;stroke-opacity:.10}
.hudFrame{fill:rgba(4,22,38,.78);stroke:#38e8ff;stroke-width:1.5}
.hudStrong{stroke-width:2;filter:drop-shadow(0 0 6px rgba(56,232,255,.55))}
.hud[data-tap]{cursor:pointer;pointer-events:auto}
.hbtn:active .hudFrame{fill:rgba(56,232,255,.25)}
.hudT{font-size:13px;font-weight:700;fill:#7fe8ff;letter-spacing:1.5px}
.hudV{font-size:24px;font-weight:700;fill:#fff}
.hudS{font-size:14px;font-weight:600;fill:#8fb3c9;letter-spacing:.5px}
.coLine{fill:none;stroke:#38e8ff;stroke-width:1.2;stroke-opacity:.75}
.coDot{fill:#38e8ff;filter:drop-shadow(0 0 4px #38e8ff)}
.int{fill:none;stroke:#7fe8ff;stroke-width:1.4;stroke-opacity:.55}
.intF{fill:rgba(95,233,255,.10);stroke:#7fe8ff;stroke-width:1.4;stroke-opacity:.65}
.int2{stroke:#7fe8ff;stroke-width:1.6;stroke-opacity:.6}
.tankBox{fill:#04131f;stroke:#5fe9ff;stroke-width:1.5}
.jack{fill:#5fe9ff;transition:height .8s}
.hTitle{font-size:40px;font-weight:700;fill:#fff;letter-spacing:1px}
.hSub{font-size:14px;font-weight:600;fill:#7fe8ff;letter-spacing:2px}
.hChip{font-size:13px;font-weight:700;fill:#cfe9f5;letter-spacing:1px}
.hTemp{font-size:40px;font-weight:700;fill:#fff}
.hBtnT{font-size:16px;font-weight:700;fill:#dff8ff;letter-spacing:1.2px}
.hClock{font-size:64px;font-weight:700;fill:#fff;letter-spacing:2px;filter:drop-shadow(0 0 8px rgba(56,232,255,.6))}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(1240px)}}
.platEdge{filter:drop-shadow(0 0 8px #38e8ff);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.45}}
.platRun{animation:run 2.5s linear infinite}
@keyframes run{to{stroke-dashoffset:-108}}
@media (prefers-reduced-motion:reduce){.scan,.platEdge,.platRun,.fl .flow{animation:none}}
#batBox{position:absolute;inset:0;background:rgba(3,10,18,.85);display:none;align-items:center;justify-content:center;z-index:40}
#ringBox{position:absolute;inset:0;background:rgba(3,10,18,.92);display:none;align-items:center;justify-content:center;z-index:50;text-align:center;animation:ringPulse 1s ease-in-out infinite}
@keyframes ringPulse{50%{background:rgba(40,10,18,.92)}}
.imgLbl{font-size:13px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#03101c;stroke-width:3px;font-family:"Rajdhani","Arial Narrow",system-ui,sans-serif}
#osk{position:absolute;left:0;right:0;bottom:0;z-index:60;background:#070c12;border-top:1px solid var(--line);padding:8px 10px 10px;
  transform:translateY(105%);transition:transform .18s ease-out;box-shadow:0 -10px 30px rgba(0,0,0,.6)}
#osk.open{transform:none}
.oskBar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.oskPrev{flex:1;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:20px;padding:0 14px;display:flex;align-items:center;overflow:hidden;white-space:pre}
.oskCur{display:inline-block;width:2px;height:24px;background:var(--cyan);margin-left:2px;animation:oskBlink 1s steps(1) infinite}
@keyframes oskBlink{50%{opacity:0}}
.oskRow{display:flex;gap:6px;margin-top:6px}
.oskKey{flex:1;height:52px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-family:inherit;font-size:22px;font-weight:600;touch-action:manipulation;padding:0}
.oskKey.oskWide{flex:1.6;font-size:17px}
.oskKey.oskFn{background:#223042}
.oskKey.oskSpace{flex:5;font-size:16px;color:var(--mute)}
.oskKey.on{background:var(--blue);border-color:var(--blue);color:#fff}
.oskKey.down{background:var(--cyan);color:#001018}
.oskBar .oskKey{flex:none;width:140px;height:44px;background:var(--blue);border-color:var(--blue);color:#fff}
.fsBtn{width:46px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;padding:0}
#pinBox{position:absolute;inset:0;background:rgba(3,10,18,.88);display:none;align-items:center;justify-content:center;z-index:70}
.pinDots{font-size:34px;letter-spacing:10px;height:50px;color:var(--cyan)}
.pinGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinKey{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:28px;font-weight:650;font-family:inherit}
.pinKey:active{background:var(--cyan);color:#001018}
.pinOk{background:var(--green);border-color:var(--green);color:#fff;font-size:22px}
.verTag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
</style>
</head>
<body>
<div id="stage">
  <nav id="nav"></nav>
  <header>
    <span class="veh" id="veh">Dethleffs XXL A</span>
    <span class="place" id="place"></span>
    <span class="verTag" id="appVer"></span>
    <span id="alarmBadge"></span>
    <span class="sp"></span>
    <span class="wx" id="hdrWx"></span>
    <span class="dot" id="conn" title="Verbindung zum Cerbo"></span>
    <div class="date" id="date"></div>
    <span class="clock" id="clock">--:--</span>
    <button class="fsBtn" data-tap="fs" title="Vollbild ein/aus">⛶</button>
  </header>
  <main id="main"></main>
  <div id="dim"></div>
</div>

<script src="static/vendor/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
"use strict";
// ===========================================================================
// Daten
// ===========================================================================
const V = {};                 // "dienst/instanz/pfad" -> Wert
let ST = {cerbo:"Verbinde ...", online:false, shr:"", shr_enabled:false, portal_id:""};
let LITHIUM = {}, LEVEL = null, AC = null, GUARD = null;
let APPVER = null, UPD = null, CHANGELOG = [];
const appVersion = () => ST.app_version || (CHANGELOG[0] && CHANGELOG[0].version) || "";
const BATSCAN = {open: false, busy: false, found: [], searched: false};
let WX = null, PLACE = "";
let ws = null, DEMO = false, holding = 0;

const v = p => V[p];
const n = p => { const x = V[p]; return typeof x === "number" ? x : null; };
function instances(service){
  const s = new Set();
  const pre = service + "/";
  for (const k in V) if (k.startsWith(pre)) s.add(k.split("/")[1]);
  return [...s].sort((a,b)=>a-b);
}
const sv = (svc,i,p) => V[`${svc}/${i}/${p}`];
const sn = (svc,i,p) => { const x = sv(svc,i,p); return typeof x === "number" ? x : null; };
const add = (...a) => { let r = null; for (const x of a) if (x != null) r = (r || 0) + x; return r; };
function devName(svc,i){
  return sv(svc,i,"CustomName") || sv(svc,i,"ProductName") || `${svc} ${i}`;
}

// Zahlen deutsch formatieren
function f(x, d=0, unit=""){
  if (x == null || isNaN(x)) return `--${unit?`<span class="u">${unit}</span>`:""}`;
  const s = Number(x).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
  return unit ? `${s}<span class="u">${unit}</span>` : s;
}
function fp(x, d=0, unit=""){ return (x==null||isNaN(x)) ? "--" : Number(x).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d}) + (unit?" "+unit:""); }
function fW(w){ if (w==null) return f(null,0,"W"); return Math.abs(w)>=1000 ? f(w/1000,2,"kW") : f(w,0,"W"); }
function fWp(w){ if (w==null) return "--"; return Math.abs(w)>=1000 ? fp(w/1000,2,"kW") : fp(w,0,"W"); }
function ttg(s){ if (s==null||s<=0) return "--"; const m=Math.round(s/60); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const T_STATE = {0:"Aus",1:"Stromsparen",2:"Fehler",3:"Bulk",4:"Absorption",5:"Erhaltung",6:"Speicher",7:"Ausgleich",8:"Durchleitung",9:"Wechselrichter",10:"Unterstützung",11:"Netzteil",245:"Wartet",247:"Ausgleich",252:"Extern gesteuert"};
const T_MODE = {1:"Nur Laden",2:"Nur Wechselrichter",3:"AN",4:"AUS"};
const T_SRC = {0:"--",1:"Netz",2:"Generator",3:"Landstrom",240:"Nicht verbunden"};
const T_FLUID = {0:"Kraftstoff",1:"Frischwasser",2:"Grauwasser",3:"Livewell",4:"Öl",5:"Schwarzwasser",6:"Benzin",7:"Diesel",8:"Gas",9:"LNG",10:"Hydrauliköl",11:"Rohwasser"};
const C_FLUID = {0:"#ffc233",1:"#3ba3ff",2:"#8a9bb0",5:"#a0785a",6:"#ffc233",7:"#ffc233",8:"#ff8a3d"};
const T_DI = {0:"Aus",1:"An",2:"Aus",3:"An",4:"Nein",5:"Ja",6:"Offen",7:"Geschlossen",8:"OK",9:"Alarm",10:"Läuft",11:"Gestoppt"};
const T_GEN = {0:"Gestoppt",1:"Läuft",2:"Aufwärmen",3:"Abkühlen",4:"Stoppt",10:"Fehler"};

// ===========================================================================
// Verbindung zum Backend
// ===========================================================================
function connect(){
  let opened = false;
  try { ws = new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws`); }
  catch(e){ startDemo(); return; }
  ws.onopen = () => { opened = true; };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "snapshot") { for (const k in V) delete V[k]; Object.assign(V, m.values); }
    else if (m.type === "delta") Object.assign(V, m.values);
    else if (m.type === "status") {
      ST = m;
      // nach einem Update hat der Server eine neue Version -> Seite neu laden
      if (m.version) { if (APPVER && APPVER !== m.version) location.reload(); APPVER = m.version; }
    }
    else if (m.type === "update") UPD = m.update;
    else if (m.type === "changelog") CHANGELOG = m.changelog;
    else if (m.type === "pin_result") { if (m.ok) pinClose(); else { PIN.val = ""; PIN.msg = "Falsche PIN"; pinRender(); } }
    else if (m.type === "weather") { WX = m.weather; PLACE = m.place; }
    else if (m.type === "lithium") LITHIUM = m.lithium;
    else if (m.type === "batscan") { BATSCAN.busy = m.busy; BATSCAN.found = m.found; BATSCAN.searched = true; }
    else if (m.type === "level") LEVEL = m.level;
    else if (m.type === "ac") AC = m.ac;
    else if (m.type === "alarms") ALARMS = m.alarms;
    else if (m.type === "guard") { GUARD = m.guard; if (!GUARD.triggered) guardShown = false; }
    schedule();
  };
  ws.onclose = () => { if (!opened && !DEMO) startDemo(); else if (!DEMO) setTimeout(connect, 3000); };
  setTimeout(() => { if (!opened && !DEMO) { try{ws.close();}catch(e){} startDemo(); } }, 2500);
}
function send(msg){
  if (DEMO) { demoCommand(msg); schedule(); return; }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}
const write = (path, value) => send({type:"write", path, value});

// ===========================================================================
// Halten-zum-Schalten
// ===========================================================================
function holdBtn(label, action, cls="", disabled=false){
  return `<button class="btn ${cls}" data-hold="${esc(action)}" ${disabled?"disabled":""}><i class="fill"></i><span>${label}</span></button>`;
}
document.addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-hold]");
  if (!b || b.disabled) return;
  holding++;
  b.classList.add("holding");
  const t = setTimeout(() => { done(); runAction(b.dataset.hold); }, 900);
  const done = () => { clearTimeout(t); b.classList.remove("holding"); holding = Math.max(0, holding-1);
    removeEventListener("pointerup", done); removeEventListener("pointercancel", done); };
  addEventListener("pointerup", done); addEventListener("pointercancel", done);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tap]");
  if (b && !b.disabled) runAction(b.dataset.tap);
});
function runAction(a){
  const [cmd, ...p] = a.split("|");
  if (cmd === "w") write(p[0], Number(p[1]));
  else if (cmd === "shr") send({type:"shr", cmd:p[0]});
  else if (cmd === "limit") limitStep(Number(p[0]), p[1]);
  else if (cmd === "limitset") limitSet(Number(p[0]), p[1]);
  else if (cmd === "page") show(p[0]);
  else if (cmd === "dev") { selDev = p[0]; schedule(); }
  else if (cmd === "levelcal") send({type:"level_cal"});
  else if (cmd === "bat") batAction(p);
  else if (cmd === "fs") fsToggle();
  else if (cmd === "rollback") { send({type: "rollback"}); UPD = Object.assign({}, UPD, {status: "Wechsle zur vorherigen Version ..."}); }
  else if (cmd === "upd") { send({type: "update_check", apply: true}); UPD = Object.assign({}, UPD, {status: "Suche ..."}); }
  else if (cmd === "guard") send({type:"guard", armed: p[0] === "1"});
  else if (cmd === "guardtest") send({type:"guard_test"});
  else if (cmd === "ac") { const v = p[0] === "target" ? Number(p[1]) : (p[0] === "mode" || p[0] === "fan") ? p[1] : p[1] === "1"; acSend({[p[0]]: v}); }
  else if (cmd === "tm" || cmd === "alf" || cmd === "al") clockAction(cmd, p[0], p[1]);
  else if (cmd === "ring") ringStop(p[0] === "snooze");
  else if (cmd === "radio") { unlockAudio(); radioAction(p[0], p[1]); }
  schedule();
}

// Landstrom-Begrenzung: Schritte sammeln, 1,5 s nach dem letzten Tippen senden
let limitPending = null, limitTimer = null;
function limitStep(d, inst){
  const cur = limitPending ?? sn("vebus",inst,"Ac/ActiveIn/CurrentLimit") ?? 16;
  limitSet(Math.min(50, Math.max(1, cur + d)), inst);
}
function limitSet(val, inst){
  limitPending = val;
  clearTimeout(limitTimer);
  limitTimer = setTimeout(() => { write(`vebus/${inst}/Ac/ActiveIn/CurrentLimit`, limitPending); setTimeout(()=>{limitPending=null;schedule();},4000); }, 1500);
}

// ===========================================================================
// Symbole
// ===========================================================================
const IC = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  energy:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  batt:'<rect x="3" y="7" width="16" height="11" rx="2"/><path d="M21 11v3"/><path d="M7 11h4M9 9v4"/>',
  plug:'<path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/>',
  tank:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',

function wxIcon(code, day=1){
  const sun = day ? '<circle cx="24" cy="22" r="9" fill="#ffc233"/><g stroke="#ffc233" stroke-width="3" stroke-linecap="round"><path d="M24 5v4M24 35v4M7 22h4M37 22h4M12 10l3 3M36 10l-3 3M12 34l3-3M36 34l-3-3"/></g>'
                  : '<path d="M30 8a13 13 0 1 0 10 19A11 11 0 0 1 30 8z" fill="#d6dcff"/>';
  const cloud = (c="#cfd8e3") => `<path d="M16 46h26a9 9 0 0 0 0-18 12 12 0 0 0-23 3 8 8 0 0 0-3 15z" fill="${c}"/>`;
  const drops = '<g stroke="#3ba3ff" stroke-width="3" stroke-linecap="round"><path d="M20 50l-2 6M29 50l-2 6M38 50l-2 6"/></g>';
  const flakes = '<g fill="#fff"><circle cx="20" cy="54" r="2.5"/><circle cx="29" cy="57" r="2.5"/><circle cx="38" cy="54" r="2.5"/></g>';
  const bolt = '<path d="M30 46l-6 9h6l-3 7 9-11h-6l3-5z" fill="#ffc233"/>';
  let g;
  if (code === 0) g = `<g transform="translate(8,10)">${sun}</g>`;
  else if (code <= 2) g = `<g transform="translate(-2,0) scale(.85)">${sun}</g>${cloud()}`;
  else if (code === 3) g = cloud("#aab6c4");
  else if (code <= 48) g = `${cloud("#aab6c4")}<g stroke="#aab6c4" stroke-width="3" stroke-linecap="round"><path d="M12 54h36M16 60h28"/></g>`;
  else if (code <= 67 || (code >= 80 && code <= 82)) g = cloud("#aab6c4") + drops;
  else if (code <= 77 || code === 85 || code === 86) g = cloud() + flakes;
  else g = cloud("#8a96a6") + bolt;
  return `<svg viewBox="0 0 64 64">${g}</svg>`;
}

function hudFrame(w, h, c = 10){ return `M${c} 0 H${w} V${h - c} L${w - c} ${h} H0 V${c} Z`; }

function calloutSvg(co){
  const [ax, ay] = P(...co.a), [x, y, w, h] = co.b;
  let bx, by, d;
  if (y + h < ay - 20)      { bx = x + w / 2; by = y + h; d = `M${ax} ${ay} V${by + 18} H${bx} V${by}`; }
  else if (y > ay + 20)     { bx = x + w / 2; by = y;     d = `M${ax} ${ay} V${by - 16} H${bx} V${by}`; }
  else                      { bx = x + w;     by = y + h / 2; d = `M${ax} ${ay} V${by} H${bx}`; }
  return `<path class="coLine" d="${d}"/><circle class="coDot" cx="${ax}" cy="${ay}" r="4"/>
    <g class="hud" transform="translate(${x},${y})" ${co.go ? `data-tap="page|${co.go}"` : ""}>
      <path d="${hudFrame(w, h)}" class="hudFrame"/>
      <text x="12" y="19" class="hudT">${co.t}</text>
      <text x="12" y="47" class="hudV" id="${co.id}V">--</text>
      <text x="12" y="${h - 11}" class="hudS" id="${co.id}S"></text></g>`;
}

// Hintergrund-Netz (fest, damit es nicht flackert)
function constellation(){
  let s = 7, r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const pts = Array.from({length: 46}, () => [r() * 1188, r() * 300 + 10]);
  let o = "";
  pts.forEach((p, i) => { const q = pts[(i * 7 + 3) % pts.length];
    if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 260) o += `<line x1="${p[0]|0}" y1="${p[1]|0}" x2="${q[0]|0}" y2="${q[1]|0}"/>`; });
  return `<g class="net">${o}${pts.map(p => `<circle cx="${p[0]|0}" cy="${p[1]|0}" r="1.6"/>`).join("")}</g>`;
}

// ===========================================================================
// 3D-Startseite: Dethleffs Globetrotter XXL A als Hologramm-Modell (three.js), Alkoven
// Maße nach Herstellerangaben: Länge 8,86 m, Breite 2,35 m, Höhe 3,45 m,
// Radstand 4,75 m, Iveco Daily mit Zwillingsbereifung hinten, Doppelboden,
// Alkoven über dem Iveco-Fahrerhaus, Einzelbetten hinten über der Garage,
// Garagenklappen beidseitig, Fenster mit dunklen Trapez-Rahmen (nach Fotos).
// Koordinaten: x = Länge (Bug bei 0), y = Höhe, z = Breite (rechte Seite = -z)
// ===========================================================================
const HAS3D = (() => { try { return !!window.THREE && !!document.createElement("canvas").getContext("webgl"); } catch (e) { return false; } })();
const L = 8.86, HB = 2.25;               // Länge, Kastenbreite ohne Rundung
const W = (x, y, z) => new THREE.Vector3(x - L / 2, y, z);
let G = null;                            // 3D-Szene und Teile

function glowTex(){
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,255,255,.7)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function build3D(canvas){
  const T = THREE;
  const renderer = new T.WebGLRenderer({canvas, antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
  renderer.setSize(1188, 720, false);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(27, 1188 / 720, 0.1, 100);
  scene.add(new T.HemisphereLight(0xbff6ff, 0x061626, 0.9));
  const dl = new T.DirectionalLight(0xffffff, 0.8); dl.position.set(-6, 10, -8); scene.add(dl);
  const root = new T.Group(); scene.add(root);
  const CY = 0x5fe9ff;

  const glass = (c = CY, o = .16) => new T.MeshStandardMaterial({color: c, transparent: true, opacity: o, roughness: .2, metalness: .1, emissive: c, emissiveIntensity: .12, depthWrite: false, side: T.DoubleSide});
  const solid = (c, e = .25, o = 1) => new T.MeshStandardMaterial({color: c, emissive: c, emissiveIntensity: e, roughness: .5, transparent: o < 1, opacity: o});
  const edgeMat = (c = CY, o = .9) => new T.LineBasicMaterial({color: c, transparent: true, opacity: o});
  const edges = (geo, c, o, ang = 25) => new T.LineSegments(new T.EdgesGeometry(geo, ang), edgeMat(c, o));
  function box(x0, x1, y0, y1, z0, z1, mat, edgeC, edgeO = .7){
    const g = new T.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    g.translate((x0 + x1) / 2 - L / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    const m = new T.Mesh(g, mat); root.add(m);
    if (edgeC != null) root.add(edges(g, edgeC, edgeO));
    return m;
  }

  // ---- Wohnaufbau mit Alkoven (Seitenprofil nach Fotos, extrudiert) ----
  // Bug bei x = 0. Fahrerhaus bis 2,57 m, Alkovennase bei 0,69 m, Dach 3,35 m.
  const s = new T.Shape();
  s.moveTo(2.57, 0.50);
  s.lineTo(2.57, 2.22);                                    // Rückwand Fahrerhaus
  s.lineTo(1.05, 2.22);                                    // Alkovenboden
  s.quadraticCurveTo(0.74, 2.24, 0.70, 2.50);              // Alkovennase unten
  s.quadraticCurveTo(0.66, 2.86, 0.92, 3.12);              // Nase vorne
  s.quadraticCurveTo(1.30, 3.38, 2.10, 3.36);              // Übergang zum Dach
  s.lineTo(8.62, 3.36); s.quadraticCurveTo(8.86, 3.36, 8.86, 3.10);
  s.lineTo(8.86, 0.66); s.quadraticCurveTo(8.86, 0.50, 8.70, 0.50);
  s.lineTo(6.62, 0.50); s.absarc(6.05, 0.47, 0.55, 0, Math.PI, false);
  s.lineTo(2.57, 0.50);
  const bodyGeo = new T.ExtrudeGeometry(s, {depth: HB, bevelEnabled: true, bevelThickness: .05, bevelSize: .05, bevelSegments: 3, steps: 1, curveSegments: 20});
  bodyGeo.translate(-L / 2, 0, -HB / 2);
  const bodyMat = glass(0xe9fbff, .26);
  root.add(new T.Mesh(bodyGeo, bodyMat));
  root.add(edges(bodyGeo, CY, .95, 30));
  const ZS = HB / 2 + .052;               // Außenseite Aufbau

  // ---- Fahrerhaus Iveco Daily (schmaler, eigene Form) ----
  const cs = new T.Shape();
  cs.moveTo(0.06, 0.32);
  cs.lineTo(-0.02, 0.50); cs.lineTo(0.00, 0.98);           // Stoßfänger, Grill
  cs.quadraticCurveTo(0.10, 1.12, 0.45, 1.24);             // Motorhaube vorne
  cs.lineTo(0.92, 1.42);                                   // Haube
  cs.lineTo(1.55, 2.12); cs.quadraticCurveTo(1.62, 2.20, 1.75, 2.20); // Windschutzscheibe
  cs.lineTo(2.62, 2.20); cs.lineTo(2.62, 0.50);
  cs.lineTo(1.55, 0.50); cs.absarc(1.00, 0.45, 0.55, 0, Math.PI, false);
  cs.lineTo(0.30, 0.34); cs.lineTo(0.06, 0.32);
  const CW = 1.96;
  const cabGeo = new T.ExtrudeGeometry(cs, {depth: CW, bevelEnabled: true, bevelThickness: .08, bevelSize: .06, bevelSegments: 3, steps: 1, curveSegments: 16});
  cabGeo.translate(-L / 2, 0, -CW / 2);
  root.add(new T.Mesh(cabGeo, glass(0xf2fcff, .30)));
  root.add(edges(cabGeo, CY, .9, 30));
  const ZC = CW / 2 + .082;
  // Windschutzscheibe
  const ws = new T.BufferGeometry();
  const wv = [[0.97, 1.47, -0.92], [0.97, 1.47, 0.92], [1.52, 2.10, 0.9], [1.52, 2.10, -0.9]].map(p => W(p[0] - .05, p[1] + .045, p[2]));
  ws.setFromPoints([wv[0], wv[1], wv[2], wv[0], wv[2], wv[3]]); ws.computeVertexNormals();
  const winMat = new T.MeshStandardMaterial({color: 0x0b2f4f, emissive: 0x2a8fd0, emissiveIntensity: .35, transparent: true, opacity: .82, roughness: .05, side: T.DoubleSide});
  root.add(new T.Mesh(ws, winMat));
  root.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(wv), edgeMat(CY, 1)));
  // Scheinwerfer (schmal, nach außen gezogen), Grill, Stoßfänger
  for (const z of [-1, 1]) {
    box(0.02, 0.30, 1.00, 1.10, z * 0.58, z * 0.95, solid(0xe8fbff, 1.4));
    box(1.42, 1.52, 1.62, 1.86, z * 1.06, z * 1.20, solid(0x0d2234, .3), CY, .8);   // Spiegel
  }
  box(-0.04, 0.02, 0.62, 0.95, -0.55, 0.55, solid(0x0d2234, .25), CY, .6);          // Grill
  box(-0.06, 0.10, 0.32, 0.55, -1.0, 1.0, solid(0x1a2c3a, .2), CY, .5);             // Stoßfänger

  // ---- Flächen auf den Seiten ----
  function sidePoly(pts, side, mat, lineC, z = ZS){
    const sh = new T.Shape(pts.map(p => new T.Vector2(p[0], p[1])));
    const g = new T.ShapeGeometry(sh);
    g.translate(-L / 2, 0, 0);
    const m = new T.Mesh(g, mat);
    m.position.z = side * (z + .004);
    root.add(m);
    if (lineC != null) { const e = edges(g, lineC, .9); e.position.z = m.position.z; root.add(e); }
    return m;
  }
  const rect = (x0, y0, x1, y1, r = .06) => {
    const p = []; const seg = 4;
    const c = [[x1 - r, y0 + r, -Math.PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, Math.PI / 2], [x0 + r, y0 + r, Math.PI]];
    for (const [cx, cy, a0] of c) for (let k = 0; k <= seg; k++) { const a = a0 + k / seg * Math.PI / 2; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    return p;
  };
  const frameMat = new T.MeshBasicMaterial({color: 0x3a4652, transparent: true, opacity: .85, side: T.DoubleSide});   // dunkle Fensterrahmen-Grafik
  const panelMat = glass(0xdff6ff, .14);
  const lineMat = new T.MeshBasicMaterial({color: 0x0a0f14, transparent: true, opacity: .95, side: T.DoubleSide});
  const greyMat = new T.MeshBasicMaterial({color: 0x8c99a6, transparent: true, opacity: .7, side: T.DoubleSide});
  // Fenster mit schrägem dunklem Rahmen (Trapez wie am Fahrzeug)
  const trapWin = (x0, x1, y0, y1, side, slant = .22) => {
    sidePoly([[x0 - .12 - slant, y0 - .08], [x1 + .12, y0 - .08], [x1 + .12, y1 + .08], [x0 - .12, y1 + .08]], side, frameMat);
    sidePoly(rect(x0, y0, x1, y1, .05), side, winMat, CY, ZS + .003);
  };
  // Dekorlinie: steigt vom Fahrerhaus zum Heck an
  const decor = (side) => {
    const band = (dy, h, m) => sidePoly([[2.57, 1.52 + dy], [8.86, 2.20 + dy], [8.86, 2.20 + dy + h], [2.57, 1.52 + dy + h]], side, m);
    band(0, .035, lineMat); band(-.09, .02, greyMat);
    sidePoly([[0.95, 1.30], [2.62, 1.52], [2.62, 1.555], [0.95, 1.335]], side, lineMat, null, ZC);
  };
  // rechte Seite (-z): Alkovenfenster, Wohnraumfenster, Tür, zwei Heckfenster, Garagenklappe
  trapWin(1.30, 2.18, 2.66, 3.02, -1, .25);
  trapWin(2.85, 3.62, 2.02, 2.62, -1);
  sidePoly(rect(4.31, 0.62, 5.00, 2.62, .05), -1, panelMat, CY);
  sidePoly(rect(4.40, 1.62, 4.90, 2.42, .05), -1, winMat, null, ZS + .003);
  trapWin(6.25, 6.80, 2.06, 2.58, -1, .15);
  trapWin(7.45, 8.55, 2.06, 2.58, -1, .3);
  sidePoly(rect(7.75, 0.60, 8.68, 1.75, .04), -1, panelMat, CY);
  sidePoly(rect(5.85, 2.70, 6.30, 2.92, .03), -1, panelMat, CY);           // Lüftungsgitter
  sidePoly(rect(5.85, 1.42, 6.30, 1.64, .03), -1, panelMat, CY);
  // linke Seite (+z): Alkovenfenster, Sitzgruppe, Küche, Heck, Garagenklappe
  trapWin(1.30, 2.18, 2.66, 3.02, 1, .25);
  trapWin(3.05, 4.30, 2.02, 2.62, 1);
  trapWin(5.00, 5.80, 2.10, 2.50, 1, .12);
  trapWin(7.30, 8.20, 2.04, 2.58, 1, .25);
  sidePoly(rect(7.70, 0.60, 8.62, 1.90, .04), 1, panelMat, CY);
  for (const side of [-1, 1]) {
    decor(side);
    // Fahrerhaus: Seitenfenster und Tür
    sidePoly([[1.62, 1.58], [2.45, 1.58], [2.45, 2.08], [2.05, 2.08]], side, winMat, CY, ZC);
    sidePoly(rect(1.45, 0.55, 2.55, 2.12, .05), side, glass(0xdff6ff, .06), CY, ZC - .002);
    // Serviceklappen unten
    for (const [a, b] of side < 0 ? [[2.75, 3.55], [3.65, 4.15], [5.25, 5.75], [6.95, 7.45]] : [[2.9, 3.6], [4.4, 5.0], [5.2, 5.6], [6.9, 7.5]])
      sidePoly(rect(a, 0.70, b, 1.00, .03), side, panelMat, CY);
  }
  // Trittstufe unter der Tür, Landstromdose
  box(4.35, 4.95, 0.28, 0.32, -ZS - .45, -ZS - .05, solid(0x9fefff, .5), CY, .9);
  const sock = box(3.85, 3.98, 1.05, 1.18, -ZS - .03, -ZS, solid(0x38e8ff, .9));
  // Heck: Rückleuchten, Markise rechts oben, Dachreling
  for (const z of [-1.06, 1.06]) box(8.86, 8.90, 0.70, 1.60, z - .06, z + .06, solid(0xff3040, 1.2));
  box(1.95, 8.30, 3.14, 3.30, -ZS - .16, -ZS, solid(0xdff6ff, .25, .9), CY, .8);
  for (const z of [-1.0, 1.0]) box(3.4, 8.5, 3.40, 3.44, z - .02, z + .02, solid(0x9fefff, .4), CY, .5);

  // ---- Dach: Klimaanlage (vorne, über dem Alkoven-Ende), Solar, Antenne ----
  const pvMat = solid(0x1d4fd8, .35);
  G = {renderer, scene, cam, root, parts: {}};
  G.parts.pv = [];
  for (const [x0, x1] of [[3.55, 5.15], [5.30, 6.90], [7.05, 8.40]]) {
    G.parts.pv.push(box(x0, x1, 3.40, 3.45, -0.95, -0.05, pvMat, 0x7fb0ff, .9));
  }
  const acDome = new T.SphereGeometry(0.5, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2);
  acDome.scale(1.1, 0.42, 0.9); acDome.translate(2.55 - L / 2, 3.36, 0.05);
  root.add(new T.Mesh(acDome, solid(0xeaf6ff, .25, .9))); root.add(edges(acDome, CY, .7, 40));
  box(2.62, 2.66, 3.36, 4.35, 0.55, 0.59, solid(0x9fefff, .4), CY, .6);            // Antenne
  box(4.0, 4.6, 3.40, 3.52, 0.25, 0.85, glass(0xbff6ff, .35), CY, .8);            // Dachhaube

  // ---- Innenraum (angedeutet) ----
  const intM = glass(0x9fefff, .20), intE = 0x7fe8ff;
  box(2.60, 8.80, 0.93, 0.97, -1.1, 1.1, glass(CY, .10), CY, .35);         // Boden über Doppelboden
  box(1.75, 2.45, 0.60, 1.20, -0.85, -0.15, intM, intE, .6);               // Beifahrersitz
  box(1.75, 2.45, 0.60, 1.20, 0.15, 0.85, intM, intE, .6);                 // Fahrersitz
  box(0.85, 2.60, 2.27, 2.45, -1.05, 1.05, intM, intE, .6);                // Alkovenbett
  box(2.70, 3.15, 0.97, 1.45, 0.30, 1.08, intM, intE, .6);                 // Sitzbank
  box(3.95, 4.35, 0.97, 1.45, 0.30, 1.08, intM, intE, .6);                 // Sitzbank
  box(3.20, 3.90, 1.70, 1.75, 0.30, 1.05, solid(0x9fefff, .4, .6), intE, .8); // Tisch
  box(2.70, 3.80, 0.97, 1.45, -1.08, -0.60, intM, intE, .6);               // Längsbank
  box(4.45, 5.20, 0.97, 1.85, 0.50, 1.08, intM, intE, .7);                 // Küche
  box(5.05, 5.65, 0.97, 3.25, -1.08, -0.45, intM, intE, .8);               // Kühlschrank raumhoch
  box(5.75, 6.65, 0.97, 3.25, -1.08, 1.08, glass(0x9fefff, .07), intE, .5); // Bad
  box(6.70, 8.80, 1.80, 2.00, -1.05, -0.12, intM, intE, .7);               // Einzelbett rechts
  box(6.70, 8.80, 1.80, 2.00, 0.12, 1.05, intM, intE, .7);                 // Einzelbett links
  box(6.70, 8.80, 0.97, 1.80, -1.1, 1.1, glass(CY, .05), intE, .45);       // Garage

  // ---- Doppelboden: Tanks, Batterie, MultiPlus ----
  const shell = (x0, x1, y0, y1, z0, z1, c) => box(x0, x1, y0, y1, z0, z1, glass(c, .12), c, .9);
  const fill = (x0, x1, y0, y1, z0, z1, c) => { const m = box(x0, x1, y0, y1, z0, z1, solid(c, .6, .9)); m.userData = {y0, h: y1 - y0}; return m; };
  shell(2.75, 3.95, 0.55, 0.90, -0.55, 0.55, 0x3ba3ff);
  G.parts.fresh = fill(2.78, 3.92, 0.57, 0.88, -0.52, 0.52, 0x3ba3ff);
  shell(4.10, 5.20, 0.55, 0.90, -0.55, 0.55, 0x9fb4c8);
  G.parts.grey = fill(4.13, 5.17, 0.57, 0.88, -0.52, 0.52, 0x9fb4c8);
  shell(5.35, 6.05, 0.55, 0.90, 0.15, 0.95, 0x34e39b);
  G.parts.batt = fill(5.38, 6.02, 0.57, 0.88, 0.18, 0.92, 0x34e39b);
  box(7.05, 7.55, 1.0, 1.42, -1.0, -0.55, solid(0x1d6fe0, .7), 0x9fd0ff, 1);   // MultiPlus in der Garage

  // ---- Fahrgestell, Räder (vorne einfach, hinten Zwilling), Stützen ----
  box(0.6, 8.3, 0.30, 0.45, -0.55, -0.40, solid(0x163447, .2), CY, .3);
  box(0.6, 8.3, 0.30, 0.45, 0.40, 0.55, solid(0x163447, .2), CY, .3);
  function wheel(x, z, w = .22){
    const g = new T.CylinderGeometry(.372, .372, w, 32); g.rotateX(Math.PI / 2); g.translate(x - L / 2, .372, z);
    root.add(new T.Mesh(g, solid(0x07131d, .05)));
    root.add(edges(g, CY, .9, 40));
    const h = new T.CylinderGeometry(.21, .21, w + .01, 24); h.rotateX(Math.PI / 2); h.translate(x - L / 2, .372, z);
    root.add(new T.Mesh(h, solid(0xcfe9f5, .5)));
  }
  for (const z of [-1, 1]) { wheel(1.00, z * 0.88); wheel(6.05, z * 1.02); wheel(6.05, z * .78); }
  G.parts.jacks = [];
  for (const [x, z] of [[0.55, -0.85], [0.55, 0.85], [8.35, -0.9], [8.35, 0.9]]) {
    const g = new T.CylinderGeometry(.06, .06, 1, 12); g.translate(0, -.5, 0);
    const m = new T.Mesh(g, solid(0x5fe9ff, .8)); m.position.copy(W(x, x < 1 ? .34 : .45, z)); m.scale.y = .05;
    const foot = new T.Mesh(new T.CylinderGeometry(.14, .14, .03, 16), solid(0x5fe9ff, .8));
    m.add(foot); foot.position.y = -1;
    root.add(m); G.parts.jacks.push(m);
  }

  // ---- Plattform ----
  const ph = new T.Shape([[-6.4, 0], [-5.4, -2.7], [5.4, -2.7], [6.4, 0], [5.4, 2.7], [-5.4, 2.7]].map(p => new T.Vector2(p[0], p[1])));
  const pg = new T.ExtrudeGeometry(ph, {depth: .28, bevelEnabled: false}); pg.rotateX(Math.PI / 2); pg.translate(0, -.01, 0);
  scene.add(new T.Mesh(pg, new T.MeshStandardMaterial({color: 0x0d3550, emissive: 0x0a3a5a, emissiveIntensity: .5, transparent: true, opacity: .85})));
  const pe = edges(pg, 0x38e8ff, 1, 10); scene.add(pe); G.parts.platEdge = pe;
  const ring = new T.Mesh(new T.RingGeometry(5.6, 5.75, 6, 1), new T.MeshBasicMaterial({color: 0x38e8ff, transparent: true, opacity: .5, side: T.DoubleSide}));
  ring.rotation.x = -Math.PI / 2; ring.scale.set(1.12, .52, 1); ring.position.y = .005; scene.add(ring);
  const grid = new T.GridHelper(40, 40, 0x1b6d8f, 0x0e3b52); grid.position.y = -.3; grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);

  // ---- Leuchtpunkte: Licht, Energieflüsse ----
  const tex = glowTex();
  const spr = (c, s) => { const m = new T.Sprite(new T.SpriteMaterial({map: tex, color: c, blending: T.AdditiveBlending, transparent: true, depthWrite: false})); m.scale.set(s, s, s); root.add(m); return m; };
  G.parts.lamp = spr(0xffd27a, 1.6); G.parts.lamp.position.copy(W(3.55, 2.9, 0.4));

}

function place3DCamera(t){
  // Blick schräg von vorn rechts, leichtes Schwenken; Ziehen mit dem Finger dreht
  const base = -2.42 + (G.drag ? 0 : Math.sin(t / 9000) * .10);
  const a = base + G.az, r = 15.2;
  G.cam.position.set(Math.cos(a) * r + 0.3, 5.0, Math.sin(a) * r);
  G.cam.lookAt(0.3, 1.25, 0);
}

function flowPos(f, u){
  let d = u * f.tot;
  for (let i = 0; i < f.seg.length; i++) { if (d <= f.seg[i]) return f.P[i].clone().lerp(f.P[i + 1], d / f.seg[i]); d -= f.seg[i]; }
  return f.P[f.P.length - 1].clone();
}

function frame3D(now){
  if (!G || cur !== "start" || !document.getElementById("cv3d")) { G && (G.raf = 0); return; }
  G.raf = requestAnimationFrame(frame3D);
  const dt = Math.min(.1, (now - (G.last || now)) / 1000); G.last = now;
  if (!G.drag) G.az *= .985;                        // langsam zurück in die Grundansicht
  place3DCamera(now);
  for (const f of Object.values(G.flows)) {
    f.t = (f.t + dt * .10 * f.speed) % 1;
    f.dots.forEach((d, i) => { d.visible = f.on; if (!f.on) return;
      let u = (f.t + i / f.dots.length) % 1; if (f.rev) u = 1 - u; d.position.copy(flowPos(f, u)); });
  }
  const pulse = .55 + .45 * Math.sin(now / 600);
  G.parts.platEdge.material.opacity = .55 + .45 * pulse;
  G.renderer.render(G.scene, G.cam);
  // Beschriftungslinien an die projizierten Punkte hängen
  for (const co of CALLOUTS) {
    const p = G.anchors[co.id].clone().project(G.cam);
    const ax = (p.x + 1) / 2 * 1188, ay = (1 - p.y) / 2 * 720;
    const [x, y, w, h] = co.b;
    let d;
    if (y + h < ay - 20) { const bx = x + w / 2, by = y + h; d = `M${ax.toFixed(1)} ${ay.toFixed(1)} V${by + 18} H${bx} V${by}`; }
    else if (y > ay + 20) { const bx = x + w / 2; d = `M${ax.toFixed(1)} ${ay.toFixed(1)} V${y - 16} H${bx} V${y}`; }
    else { d = `M${ax.toFixed(1)} ${ay.toFixed(1)} H${x + w + 24} V${y + h / 2} H${x + w}`; }
    const l = document.getElementById(co.id + "L"), c = document.getElementById(co.id + "D");
    if (l) l.setAttribute("d", d);
    if (c) { c.setAttribute("cx", ax.toFixed(1)); c.setAttribute("cy", ay.toFixed(1)); }
  }
}

function clockAction(cmd, a, b){
  if (cmd === "tm") {
    const v = Number(b);
    if (a === "add") { const l = timerLeft() + v; if (TIMER.running) TIMER.end += v * 1000; else TIMER.remain = Math.max(0, l); }
    if (a === "set") { TIMER.running = false; TIMER.remain = v; }
    if (a === "start" && timerLeft() > 0) { TIMER.end = Date.now() + timerLeft() * 1000; TIMER.running = true; unlockAudio(); }
    if (a === "pause") { TIMER.remain = timerLeft(); TIMER.running = false; }
    if (a === "reset") { TIMER.running = false; TIMER.remain = 300; }
  } else if (cmd === "alf") {
    const v = Number(b);
    if (a === "h") ALF.h = (ALF.h + v + 24) % 24;
    if (a === "m") ALF.m = (ALF.m + v + 60) % 60;
    if (a === "d") ALF.d = ALF.d.includes(v) ? ALF.d.filter(x => x !== v) : [...ALF.d, v].sort();
  } else if (cmd === "al") {
    const i = Number(b);
    if (a === "add") { ALARMS.push({h: ALF.h, m: ALF.m, d: [...ALF.d], on: true}); unlockAudio(); }
    if (a === "toggle") ALARMS[i].on = !ALARMS[i].on;
    if (a === "del") ALARMS.splice(i, 1);
    saveAlarms();
  }
}

// Klingeln (Wecker, Timer, Bewegungsalarm) – Ton über den Lautsprecher am Pi
let audioCtx = null, ringing = null, lastRingKey = "";
function unlockAudio(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {} }
function beep(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  for (let k = 0; k < 3; k++) { const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0, t + k * .25); g.gain.linearRampToValueAtTime(.4, t + k * .25 + .02); g.gain.linearRampToValueAtTime(0, t + k * .25 + .18);
    o.start(t + k * .25); o.stop(t + k * .25 + .2); }
}
function ring(title, sub, snooze){
  ringing = {title, sub, snooze};
  let el = document.getElementById("ringBox");
  if (!el) { el = document.createElement("div"); el.id = "ringBox"; document.getElementById("stage").appendChild(el); }
  el.innerHTML = `<div class="ringIn"><div class="big" style="font-size:72px">${esc(title)}</div><div class="mid" style="margin:10px 0 30px">${esc(sub)}</div>
    <div class="row" style="justify-content:center;gap:20px"><button class="btn sel" style="width:240px;height:90px;font-size:28px" data-tap="ring|stop">Stopp</button>
    ${snooze ? `<button class="btn" style="width:240px;height:90px;font-size:24px" data-tap="ring|snooze">Schlummern 5 min</button>` : ""}</div></div>`;
  el.style.display = "flex";
}
function ringStop(snooze){
  if (snooze && ringing && ringing.snooze) { const t = new Date(Date.now() + 5 * 60e3); ALARMS.push({h: t.getHours(), m: t.getMinutes(), d: [], on: true, once: true}); saveAlarms(); }
  ringing = null; const el = document.getElementById("ringBox"); if (el) el.style.display = "none";
}
setInterval(() => {
  const d = new Date();
  if (TIMER.running && timerLeft() === 0) { TIMER.running = false; TIMER.remain = 0; ring("Timer abgelaufen", d.toLocaleTimeString("de-DE"), false); }
  const key = `${d.getHours()}:${d.getMinutes()}`, wd = (d.getDay() + 6) % 7;
  if (key !== lastRingKey) ALARMS.forEach(a => {
    if (a.on && a.h === d.getHours() && a.m === d.getMinutes() && (!a.d || !a.d.length || a.d.includes(wd))) {
      lastRingKey = key; ring("Wecker", `${pad(a.h)}:${pad(a.m)} Uhr`, true);
      if (!a.d || !a.d.length) { a.on = false; saveAlarms(); }
    }
  });
  if (GUARD && GUARD.triggered && !ringing && !guardShown) { guardShown = true; ring("Bewegung erkannt!", "Der Bewegungsalarm wurde ausgelöst", false); }
  if (ringing) beep();
  if (cur === "clock") schedule();
}, 1000);
let guardShown = false;

  ["news", "Nachrichten"], ["oldies", "Oldies"], ["80s", "80er"], ["chillout", "Chillout"], ["jazz", "Jazz"], ["classical", "Klassik"]];
const DEMO_STATIONS = ["1LIVE", "WDR 2", "SWR3", "Antenne Bayern", "Radio Paloma", "Deutschlandfunk", "Rock Antenne", "NDR 2", "bigFM", "Klassik Radio"]
  .map(n => ({name: n, url: "", tags: "Demo", id: n}));
async function radioLoad(cat){
  RADIO.cat = cat;
  if (cat === "fav") { RADIO.list = RADIO.favs; RADIO.status = RADIO.favs.length ? "" : "Noch keine Favoriten – beim Sender auf ★ tippen"; schedule(); return; }
  RADIO.status = "Lade Sender ..."; schedule();
  const q = cat === "top" ? "bycountrycodeexact/DE?" : `search?countrycode=DE&tag=${encodeURIComponent(cat)}&`;
  try {
    const r = await fetch(`https://de1.api.radio-browser.info/json/stations/${q}order=clickcount&reverse=true&limit=40&hidebroken=true`);
    const j = await r.json();
    const seen = new Set();
    RADIO.list = j.filter(s => s.url_resolved && !seen.has(s.name.trim().toLowerCase()) && seen.add(s.name.trim().toLowerCase()))
      .map(s => ({name: s.name.trim(), url: s.url_resolved, logo: s.favicon || "", tags: (s.tags || "").split(",").slice(0, 3).join(", "), id: s.stationuuid}));
    RADIO.status = "";
  } catch (e) { RADIO.list = DEMO_STATIONS; RADIO.status = "Senderliste nicht erreichbar (Internet?) – Beispielliste"; }
  schedule();
}
function radioPlay(id){
  const s = RADIO.list.find(x => x.id === id) || RADIO.favs.find(x => x.id === id);
  if (!s) return;
  RADIO.playing = s;
  if (!s.url) { RADIO.status = "Demo: hier wird nichts abgespielt"; schedule(); return; }
  RADIO.audio.src = s.url;
  RADIO.audio.play().then(() => { RADIO.status = ""; schedule(); }).catch(e => { RADIO.status = "Sender lässt sich nicht abspielen"; schedule(); });
}
function radioAction(a, b){
  if (a === "cat") radioLoad(b);
  else if (a === "play") radioPlay(b);
  else if (a === "stop") { RADIO.audio.pause(); RADIO.audio.removeAttribute("src"); RADIO.audio.load(); RADIO.playing = null; }
  else if (a === "vol") { RADIO.vol = Math.max(0, Math.min(1, RADIO.vol + Number(b))); RADIO.audio.volume = RADIO.vol; }
  else if (a === "fav") {
    const s = RADIO.playing; if (!s) return;
    const i = RADIO.favs.findIndex(x => x.id === s.id);
    if (i >= 0) RADIO.favs.splice(i, 1); else RADIO.favs.push(s);
    try { localStorage.setItem("womoRadioFavs", JSON.stringify(RADIO.favs)); } catch (e) {}
  }
}

  </svg></div>`);
  // Leitungen vorberechnen
  for (const [k, f] of Object.entries(IFLOWS)) {
    f.pts = f.P.map(([x, y]) => [IX(x), IY(y)]);
    f.seg = []; f.tot = 0;
    for (let i = 1; i < f.pts.length; i++) { const d = Math.hypot(f.pts[i][0] - f.pts[i - 1][0], f.pts[i][1] - f.pts[i - 1][1]); f.seg.push(d); f.tot += d; }
    f.dots = [...document.querySelectorAll(`#if_${k} circle`)];
    f.t = 0; f.on = false; f.rev = false; f.speed = 1;
  }
  if (!IFLOWS.raf) IFLOWS.raf = requestAnimationFrame(frameImg);
}

function flowAt(f, u){
  let d = u * f.tot;
  for (let i = 0; i < f.seg.length; i++) {
    if (d <= f.seg[i]) { const a = f.pts[i], b = f.pts[i + 1], r = d / f.seg[i]; return [a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r]; }
    d -= f.seg[i];
  }
  return f.pts[f.pts.length - 1];
}

function frameImg(now){
  if (cur !== "start" || !document.getElementById("womoImg")) { IFLOWS.raf = 0; return; }
  IFLOWS.raf = requestAnimationFrame(frameImg);
  const dt = Math.min(.1, (now - (IFLOWS.last || now)) / 1000); IFLOWS.last = now;
  for (const f of Object.values(IFLOWS)) {
    if (!f.dots) continue;
    f.t = (f.t + dt * .07 * f.speed) % 1;
    f.dots.forEach((c, i) => {
      if (!f.on) { if (c.getAttribute("cx") !== "-20") { c.setAttribute("cx", -20); c.setAttribute("cy", -20); } return; }
      let u = (f.t + i / f.dots.length) % 1; if (f.rev) u = 1 - u;
      const [x, y] = flowAt(f, u); c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
    });
  }
}

  const tmin = Math.min(...hrs.map(x => x.T)) - 1, tmax = Math.max(...hrs.map(x => x.T)) + 1;
  const W = 740, H = 190, x = k => 20 + k * (W - 40) / 23, y = T => 20 + (H - 60) * (1 - (T - tmin) / (tmax - tmin || 1));

  const sr = new Date(d.sunrise[0]), ss = new Date(d.sunset[0]);

  paint("wx", `<div class="grid" style="grid-template-columns:360px 1fr">

let queued = false, lastPaint = 0;
function schedule(force){
  if (queued) return;
  queued = true;
  const wait = force ? 0 : Math.max(0, 500 - (Date.now() - lastPaint));
  setTimeout(() => requestAnimationFrame(() => {
    queued = false;
    if (holding && cur !== "start") { setTimeout(schedule, 300); return; }  // nicht neu zeichnen, während eine Taste gehalten wird
    lastPaint = Date.now();
    updHeader();

// ===========================================================================
// Eigene Bildschirmtastatur (QWERTZ, Umlaute) – erscheint bei jedem Eingabefeld
// ===========================================================================
const OSK = {el: null, target: null, shift: false, caps: false, sym: false};
const OSK_ROWS = {
  abc: [["1","2","3","4","5","6","7","8","9","0","ß"],
        ["q","w","e","r","t","z","u","i","o","p","ü"],
        ["a","s","d","f","g","h","j","k","l","ö","ä"],
        ["⇧","y","x","c","v","b","n","m","-",".","⌫"],
        ["?123","@",",","␣","/",":","↵"]],
  sym: [["1","2","3","4","5","6","7","8","9","0","="],
        ["!","\"","§","$","%","&","(",")","+","*","#"],
        ["€","°","_",";","'","<",">","[","]","{","}"],
        ["~","^","|","\\","´","`","²","³","µ",".","⌫"],
        ["ABC","@",",","␣","/",":","↵"]],
};
function oskEl(){
  if (OSK.el) return OSK.el;
  const el = document.createElement("div");
  el.id = "osk";
  document.getElementById("stage").appendChild(el);
  // Tasten mit pointerdown, damit das Eingabefeld den Fokus behält
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    const k = e.target.closest("[data-k]");
    if (!k) return;
    k.classList.add("down"); setTimeout(() => k.classList.remove("down"), 120);
    oskKey(k.dataset.k);
  });
  return OSK.el = el;
}
function oskRender(){
  const el = oskEl();
  const rows = OSK.sym ? OSK_ROWS.sym : OSK_ROWS.abc;
  const up = OSK.shift || OSK.caps;
  el.innerHTML = `<div class="oskBar"><span class="oskPrev">${esc(OSK.target ? OSK.target.value : "")}<i class="oskCur"></i></span>
      <button class="oskKey oskWide" data-k="hide">Fertig ▾</button></div>` +
    rows.map(r => `<div class="oskRow">${r.map(k => {
      const lab = k === "␣" ? "Leerzeichen" : (up && k.length === 1 && !OSK.sym ? k.toUpperCase() : k);
      const cls = k === "␣" ? "oskSpace" : ["⇧", "⌫", "↵", "?123", "ABC"].includes(k) ? "oskWide oskFn" : "";
      const on = k === "⇧" && (OSK.shift || OSK.caps) ? " on" : "";
      return `<button class="oskKey ${cls}${on}" data-k="${esc(k)}">${esc(lab)}${k === "⇧" && OSK.caps ? "⇪" : ""}</button>`;
    }).join("")}</div>`).join("");
}
function oskInsert(t, txt){
  const s0 = t.selectionStart ?? t.value.length, s1 = t.selectionEnd ?? t.value.length;
  t.value = t.value.slice(0, s0) + txt + t.value.slice(s1);
  const p = s0 + txt.length; try { t.setSelectionRange(p, p); } catch (e) {}
}
function oskKey(k){
  const t = OSK.target;
  if (k === "hide") { oskHide(); if (t) t.blur(); return; }
  if (!t) return;
  if (k === "⇧") { if (OSK.caps) { OSK.caps = false; OSK.shift = false; } else if (OSK.shift) { OSK.caps = true; } else OSK.shift = true; }
  else if (k === "?123") OSK.sym = true;
  else if (k === "ABC") OSK.sym = false;
  else if (k === "⌫") {
    const s0 = t.selectionStart ?? t.value.length, s1 = t.selectionEnd ?? t.value.length;
    if (s0 !== s1) oskInsert(t, ""); else if (s0 > 0) { t.value = t.value.slice(0, s0 - 1) + t.value.slice(s0); try { t.setSelectionRange(s0 - 1, s0 - 1); } catch (e) {} }
  }
  else if (k === "↵") { t.dispatchEvent(new KeyboardEvent("keydown", {key: "Enter", bubbles: true})); if (t.form) t.form.requestSubmit?.(); oskHide(); t.blur(); return; }
  else {
    let c = k === "␣" ? " " : k;
    if ((OSK.shift || OSK.caps) && !OSK.sym) c = c.toUpperCase();
    oskInsert(t, c);
    if (OSK.shift && !OSK.caps) OSK.shift = false;
  }
  if (["⌫", "␣"].includes(k) || k.length === 1) t.dispatchEvent(new Event("input", {bubbles: true}));
  oskRender();
}
function oskShow(t){
  OSK.target = t; OSK.sym = false; OSK.caps = false;
  OSK.shift = !t.value;                 // erster Buchstabe groß
  oskRender();
  OSK.el.classList.add("open");
}
function oskHide(){ if (OSK.el) OSK.el.classList.remove("open"); OSK.target = null; }
const OSK_TYPES = ["text", "search", "email", "url", "tel", "number", "password", ""];
document.addEventListener("focusin", e => {
  const t = e.target;
  if ((t.tagName === "INPUT" && OSK_TYPES.includes((t.getAttribute("type") || "").toLowerCase())) || t.tagName === "TEXTAREA") oskShow(t);
});
document.addEventListener("focusout", e => {
  setTimeout(() => { const a = document.activeElement; if (!a || (a.tagName !== "INPUT" && a.tagName !== "TEXTAREA")) oskHide(); }, 50);
});

// Vollbild: auf dem Pi schaltet der Server den Browser um (F11), sonst die Fullscreen-Schnittstelle
function isFullscreen(){ return !!document.fullscreenElement || (innerHeight >= screen.height - 2 && innerWidth >= screen.width - 2); }
function fsToggle(){
  const onPi = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !DEMO;
  if (isFullscreen()) { pinOpen(); return; }          // Verlassen nur mit PIN
  if (onPi) { send({type: "fullscreen", enter: true}); return; }
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) {}
}

// PIN-Eingabe zum Verlassen des Vollbilds (PIN steht in config.json: fullscreen_pin)
const PIN = {val: "", msg: "", el: null};
function pinOpen(){ PIN.val = ""; PIN.msg = ""; pinRender(); }
function pinClose(){ if (PIN.el) PIN.el.style.display = "none"; }
function pinRender(){
  if (!PIN.el) {
    PIN.el = document.createElement("div"); PIN.el.id = "pinBox";
    document.getElementById("stage").appendChild(PIN.el);
    PIN.el.addEventListener("pointerdown", e => {
      const b = e.target.closest("[data-pin]"); if (!b) return;
      e.preventDefault();
      const k = b.dataset.pin;
      if (k === "x") { pinClose(); return; }
      if (k === "<") PIN.val = PIN.val.slice(0, -1);
      else if (k === "ok") pinSubmit();
      else if (PIN.val.length < 8) { PIN.val += k; PIN.msg = ""; }
      pinRender();
    });
  }
  PIN.el.style.display = "flex";
  PIN.el.innerHTML = `<div class="card" style="width:400px;text-align:center;background:var(--bg)">
    <h3 style="font-size:16px;color:var(--text)">PIN zum Verlassen des Vollbilds</h3>
    <div class="pinDots">${PIN.val ? "●".repeat(PIN.val.length) : "&nbsp;"}</div>
    <div style="height:22px;color:var(--red);font-size:15px">${esc(PIN.msg)}</div>
    <div class="pinGrid">${["1","2","3","4","5","6","7","8","9","<","0","ok"].map(k =>
      `<button class="pinKey ${k === "ok" ? "pinOk" : ""}" data-pin="${k}">${k === "<" ? "⌫" : k === "ok" ? "OK" : k}</button>`).join("")}</div>
    <button class="btn" style="width:100%;margin-top:12px" data-pin="x">Abbrechen</button></div>`;
}
function pinSubmit(){
  const onPi = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !DEMO;
  if (onPi) { send({type: "fullscreen", pin: PIN.val}); return; }
  if (PIN.val === "3784") { pinClose(); try { document.exitFullscreen(); } catch (e) {} }   // Vorschau
  else { PIN.val = ""; PIN.msg = "Falsche PIN"; pinRender(); }
}
