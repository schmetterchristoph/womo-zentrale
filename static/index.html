<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Womo Zentrale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0a0f15;--panel:#121a23;--panel2:#18232f;--line:#243241;--text:#e9eff5;--mute:#8697ab;
  --blue:#3ba3ff;--green:#34c38f;--yellow:#ffc233;--orange:#ff8a3d;--red:#ff4d5e;--cyan:#3fd2e0;--violet:#a98bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:var(--H,720px);transform-origin:0 0;background:var(--bg);display:grid;grid-template-columns:92px 1fr;grid-template-rows:64px 1fr}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .4s}
/* Navigation */
nav{grid-row:1/3;background:#070b10;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
nav button{width:76px;height:calc((var(--H,720px) - 40px) / 14);max-height:58px;border:0;border-radius:16px;background:transparent;color:#b4c2d2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;letter-spacing:.2px;font-family:inherit;cursor:pointer;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;shape-rendering:geometricPrecision;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--panel2);color:var(--blue)}
/* Kopfzeile */
header{display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line)}
header .veh{font-size:20px;font-weight:650;letter-spacing:.2px}
header .place{color:var(--mute);font-size:15px}
header .sp{flex:1}
header .wx{display:flex;align-items:center;gap:8px;font-size:18px}
header .wx svg{width:34px;height:34px}
header .clock{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
header .date{color:var(--mute);font-size:13px;text-align:right;line-height:1.2}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.dot.ok{background:var(--green)}
.badge{background:var(--red);color:#fff;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600}
.badge.warn{background:var(--orange)}
main{position:relative;overflow:hidden}
.page{position:absolute;inset:0;padding:18px 22px;display:none}
.page.on{display:block}
/* Bausteine */
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;position:relative}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
.big{font-size:44px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.u{font-size:.55em;color:var(--mute);font-weight:500;margin-left:3px}
.mute{color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:17px}
.kv>:nth-child(odd){color:var(--mute)}
.kv>:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;font-weight:550}
.row{display:flex;align-items:center;gap:12px}
.btn{border:0;border-radius:14px;background:var(--panel2);color:var(--text);font-family:inherit;font-size:18px;font-weight:600;line-height:1;padding:0 18px;height:58px;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line)}
.btn.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sel.red{background:var(--red);border-color:var(--red)}
.btn.sel.green{background:var(--green);border-color:var(--green)}
.btn:disabled{opacity:.35}
.btn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.22)}
.btn.holding .fill{width:100%;transition:width .9s linear}
.btn span{position:relative}
.hint{font-size:13px;color:var(--mute)}
.bar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--blue)}
.empty{color:var(--mute);font-size:18px;padding:30px;text-align:center}
.scroll{overflow-y:auto;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
/* Start-Grafik */
.fl .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:2 12;animation:flow 1s linear infinite}
.fl .flow.rev{animation-direction:reverse}
.fl .flow.off{opacity:0;animation:none}
@keyframes flow{to{stroke-dashoffset:-28}}
.fl text{font-family:inherit;font-variant-numeric:tabular-nums}
.ring{transform:rotate(-90deg);transform-origin:50% 50%}
/* Tanks */
.tank{width:120px;height:230px;border-radius:18px;border:2px solid var(--line);background:var(--panel2);position:relative;overflow:hidden;margin:0 auto}
.tank>i{position:absolute;left:0;right:0;bottom:0;background:var(--blue);transition:height .6s}
.tank>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:650;text-shadow:0 1px 6px #000a}
/* Tabelle */
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child{color:var(--mute);word-break:break-all}
td:last-child{text-align:right}
.devlist button{display:block;width:100%;text-align:left;margin-bottom:6px;height:auto;padding:10px 12px;font-size:15px;font-weight:500}
input[type=text]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:17px;padding:0 14px;user-select:text}
input[type=range]{width:100%;height:40px;accent-color:var(--blue)}
.warnbox{background:rgba(255,138,61,.12);border:1px solid var(--orange);color:#ffd2b5;border-radius:14px;padding:10px 14px;font-size:16px}
.demo{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--orange);opacity:.8}

/* Startseite im HUD-Stil */
#stage.full header{display:none}
#stage.full main{grid-row:1/3}
#pg-start{padding:0}
.hudsvg text{font-family:"Rajdhani","Arial Narrow",system-ui,sans-serif}
.hudsvg .net line{stroke:#38e8ff;stroke-opacity:.12}
.hudsvg .net circle{fill:#5fe9ff;opacity:.4}
.floorGrid line{stroke:#38e8ff;stroke-opacity:.10}
.hudFrame{fill:rgba(4,22,38,.78);stroke:#38e8ff;stroke-width:1.5}
.hudStrong{stroke-width:2;filter:drop-shadow(0 0 6px rgba(56,232,255,.55))}
.hud[data-tap]{cursor:pointer;pointer-events:auto}
.hbtn:active .hudFrame{fill:rgba(56,232,255,.25)}
.hudT{font-size:13px;font-weight:700;fill:#7fe8ff;letter-spacing:1.5px}
.hudV{font-size:24px;font-weight:700;fill:#fff}
.hudS{font-size:14px;font-weight:600;fill:#8fb3c9;letter-spacing:.5px}
.coLine{fill:none;stroke:#38e8ff;stroke-width:1.2;stroke-opacity:.75}
.coDot{fill:#38e8ff;filter:drop-shadow(0 0 4px #38e8ff)}
.int{fill:none;stroke:#7fe8ff;stroke-width:1.4;stroke-opacity:.55}
.intF{fill:rgba(95,233,255,.10);stroke:#7fe8ff;stroke-width:1.4;stroke-opacity:.65}
.int2{stroke:#7fe8ff;stroke-width:1.6;stroke-opacity:.6}
.tankBox{fill:#04131f;stroke:#5fe9ff;stroke-width:1.5}
.jack{fill:#5fe9ff;transition:height .8s}
.hTitle{font-size:40px;font-weight:700;fill:#5dff3a;letter-spacing:1px;filter:drop-shadow(0 0 6px rgba(93,255,58,.7))}
.hSub{font-size:14px;font-weight:600;fill:#7fe8ff;letter-spacing:2px}
.hChip{font-size:13px;font-weight:700;fill:#cfe9f5;letter-spacing:1px}
.hTemp{font-size:40px;font-weight:700;fill:#fff}
.hBtnT{font-size:16px;font-weight:700;fill:#dff8ff;letter-spacing:1.2px}
.hClock{font-size:64px;font-weight:700;fill:#5dff3a;letter-spacing:2px;filter:drop-shadow(0 0 10px rgba(93,255,58,.75))}
.scan{animation:scan 6s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(1240px)}}
.platEdge{filter:drop-shadow(0 0 8px #38e8ff);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.45}}
.platRun{animation:run 2.5s linear infinite}
@keyframes run{to{stroke-dashoffset:-108}}
@media (prefers-reduced-motion:reduce){.scan,.platEdge,.platRun,.fl .flow{animation:none}}
#batBox{position:absolute;inset:0;background:rgba(3,10,18,.85);display:none;align-items:center;justify-content:center;z-index:40}
#ringBox{position:absolute;inset:0;background:rgba(3,10,18,.92);display:none;align-items:center;justify-content:center;z-index:50;text-align:center;animation:ringPulse 1s ease-in-out infinite}
@keyframes ringPulse{50%{background:rgba(40,10,18,.92)}}
.imgLbl{font-size:13px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#03101c;stroke-width:3px;font-family:"Rajdhani","Arial Narrow",system-ui,sans-serif}
#osk{position:absolute;left:0;right:0;bottom:0;z-index:60;background:#070c12;border-top:1px solid var(--line);padding:8px 10px 10px;
  transform:translateY(105%);transition:transform .18s ease-out;box-shadow:0 -10px 30px rgba(0,0,0,.6)}
#osk.open{transform:none}
.oskBar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.oskPrev{flex:1;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:20px;padding:0 14px;display:flex;align-items:center;overflow:hidden;white-space:pre}
.oskCur{display:inline-block;width:2px;height:24px;background:var(--cyan);margin-left:2px;animation:oskBlink 1s steps(1) infinite}
@keyframes oskBlink{50%{opacity:0}}
.oskRow{display:flex;gap:6px;margin-top:6px}
.oskKey{flex:1;height:52px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-family:inherit;font-size:22px;font-weight:600;touch-action:manipulation;padding:0}
.oskKey.oskWide{flex:1.6;font-size:17px}
.oskKey.oskFn{background:#223042}
.oskKey.oskSpace{flex:5;font-size:16px;color:var(--mute)}
.oskKey.on{background:var(--blue);border-color:var(--blue);color:#fff}
.oskKey.down{background:var(--cyan);color:#001018}
.oskBar .oskKey{flex:none;width:140px;height:44px;background:var(--blue);border-color:var(--blue);color:#fff}
.fsBtn{width:46px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;padding:0}
#pinBox{position:absolute;inset:0;background:rgba(3,10,18,.88);display:none;align-items:center;justify-content:center;z-index:70}
.pinDots{font-size:34px;letter-spacing:10px;height:50px;color:var(--cyan)}
.pinGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinKey{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:28px;font-weight:650;font-family:inherit}
.pinKey:active{background:var(--cyan);color:#001018}
.pinOk{background:var(--green);border-color:var(--green);color:#fff;font-size:22px}
.verTag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
#sleepBox{position:absolute;inset:0;background:#000;z-index:80;display:none;cursor:none}
/* Radio */
.rGrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:74px;gap:8px}
.rTile{display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font-family:inherit;text-align:left;cursor:pointer;min-width:0;position:relative}
.rTile.on{border-color:var(--cyan);background:linear-gradient(160deg,#123447,#0f2232);box-shadow:0 0 14px rgba(63,210,224,.25)}
.rTile:active{transform:scale(.98)}
.rTxt{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.rTxt b{font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rTxt span{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rTile.on .rTxt span{color:var(--cyan);font-weight:650}
.rFav{position:absolute;right:10px;top:6px;color:var(--yellow);font-size:14px}
.rLogo{position:relative;flex:none;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.rLogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f3f5f7;padding:4px}
/* Licht */
.lgZ{font-size:13px;font-weight:700;fill:#6f93b3;letter-spacing:2px;font-family:"Rajdhani","Arial Narrow",system-ui,sans-serif}
.lgBtn{position:absolute;width:156px;height:96px;border-radius:20px;border:1.5px solid rgba(127,232,255,.35);
  background:linear-gradient(160deg,rgba(30,48,66,.92),rgba(12,22,33,.94));color:#d6e4f0;backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit;cursor:pointer;padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.5);transition:background .3s,box-shadow .3s,border-color .3s,transform .1s}
.lgBtn.on{background:linear-gradient(160deg,#ffe08a 0%,#ffc23d 55%,#ffa51f 100%);border-color:#fff0bf;color:#3b2900;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 calc(70px * var(--glow)) rgba(255,190,60,var(--glow)),0 6px 18px rgba(0,0,0,.45)}
.lgBtn.sel{outline:3px solid #3ba3ff;outline-offset:4px}
.lgBtn.out{height:58px;flex-direction:row;gap:8px}.lgBtn.out svg{width:26px;height:26px}.lgBtn.out .lgN{font-size:16px}.lgBtn.out .lgS{display:none}
.lgBtn:active{transform:scale(.96)}
.lgN{font-size:19px;font-weight:700;line-height:1.1;letter-spacing:.2px}
.lgS{font-size:13px;font-weight:600;opacity:.75}
.lgScene{flex:1;height:84px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#1b2a3a,#121c27);color:#e3edf6;
  font-family:inherit;font-size:17px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.lgScene span{font-size:26px;line-height:1}
.lgScene:active{background:var(--blue);border-color:var(--blue)}
.lgScene.off{background:linear-gradient(160deg,#5a1d26,#3a1219);border-color:#8a2a38;color:#ffd5da}
.lgScene.cfg{flex:none;width:96px;font-size:14px;color:var(--mute)}
#lgRange{accent-color:#ffc233}
#lgSetup{position:absolute;inset:0;background:rgba(3,10,18,.9);display:none;align-items:center;justify-content:center;z-index:44}
/* Sprache */
#vcBtn{position:absolute;right:18px;bottom:16px;width:70px;height:70px;border-radius:50%;border:2px solid rgba(127,232,255,.6);z-index:42;
  background:radial-gradient(circle at 35% 30%,#2a6fb0,#0f3358);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;
  box-shadow:0 0 18px rgba(59,163,255,.45),0 6px 16px rgba(0,0,0,.5)}
#vcBtn.listen{background:radial-gradient(circle at 35% 30%,#ff6b7a,#b3132a);border-color:#ffb3bd;animation:vcPulse 1s ease-in-out infinite}
#vcBtn.think{background:radial-gradient(circle at 35% 30%,#ffd76a,#d38b00);border-color:#ffe39a}
@keyframes vcPulse{50%{box-shadow:0 0 0 14px rgba(255,77,94,.25),0 0 30px rgba(255,77,94,.7)}}
#stage.full #vcBtn{right:auto;left:106px}
#stage.full #vcToast{right:auto;left:188px;bottom:20px}
#stage:not(.full) #vcBtn{display:none!important}
#stage:not(.full) #vcToast{top:74px;bottom:auto;right:20px}
#vcBtnH{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(127,232,255,.55);background:radial-gradient(circle at 35% 30%,#2a6fb0,#0f3358);color:#fff;
  display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;margin-right:14px;flex:none}
#vcBtnH.listen{background:radial-gradient(circle at 35% 30%,#ff6b7a,#b3132a);border-color:#ffb3bd;animation:vcPulse 1s ease-in-out infinite}
#vcBtnH.think{background:radial-gradient(circle at 35% 30%,#ffd76a,#d38b00)}
#vcToast{position:absolute;right:100px;bottom:20px;max-width:560px;z-index:42;display:none;background:rgba(8,16,26,.95);border:1px solid rgba(127,232,255,.45);
  border-radius:16px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.vcH{font-size:15px;color:var(--mute);margin-bottom:3px}.vcR{font-size:20px;font-weight:650}
/* Extras-Seite */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{height:46px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:#b4c2d2;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabBadge{background:var(--orange);color:#fff;border-radius:10px;padding:1px 8px;font-size:13px}
.exPane{position:absolute;left:22px;right:22px;top:78px;bottom:18px}
.chkRow{display:flex;align-items:center;gap:12px;padding:0 10px 0 14px;height:56px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;font-size:18px}
.chkRow.done{background:rgba(52,195,143,.12);border-color:rgba(52,195,143,.5)}
.chkRow.done .chkT{color:var(--mute);text-decoration:line-through}
.chkBox{width:30px;height:30px;border-radius:8px;border:2px solid var(--mute);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.chkRow.done .chkBox{background:var(--green);border-color:var(--green);color:#fff}
.chkT{flex:1}
.iconBtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:18px;position:relative;overflow:hidden;cursor:pointer;padding:0;font-family:inherit}
.iconBtn.holding .fill{width:100%;transition:width .9s linear}
.iconBtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,77,94,.35)}
.btn.sm{height:44px;font-size:15px;padding:0 12px}
.mtRow{display:grid;grid-template-columns:1fr 150px 110px auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.mtName{font-size:17px;font-weight:600}
.mtSub{font-size:13px;color:var(--mute);margin-top:2px}
.pill{display:inline-block;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:650;text-align:center}
.pill.ok{background:rgba(52,195,143,.15);color:var(--green)}
.pill.soon{background:rgba(255,194,51,.15);color:var(--yellow)}
.pill.due{background:rgba(255,77,94,.18);color:var(--red)}
.pill.none{background:var(--panel);color:var(--mute)}
.wRow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;min-height:58px}
.wRow.off{opacity:.5}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:78px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.tog{width:70px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.tog.on{background:var(--green);border-color:var(--green);color:#fff}
.warnItem{border-left:4px solid var(--orange);background:rgba(255,138,61,.10);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.warnItem b{display:block;font-size:17px;margin-bottom:2px}
.warnItem span{font-size:14px;color:#ffd9c2}
#mapBox{position:relative;overflow:hidden;border-radius:14px;background:#0c1620;touch-action:none;cursor:grab}
#mapBox img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none;pointer-events:none;filter:brightness(.82) saturate(.85)}
#mapBox svg{position:absolute;left:0;top:0;pointer-events:none}
.mapCtl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapCtl button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(10,16,24,.85);color:#fff;font-size:22px;font-family:inherit;cursor:pointer}
.mapAttr{position:absolute;right:6px;bottom:4px;font-size:11px;color:#cfd8e3;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:6px;z-index:2}

<script>
"use strict";
let STAGE_S = 1, STAGE_H = 720;     // Bühnengröße (fit)
// ===========================================================================
// Daten
// ===========================================================================
const V = {};                 // "dienst/instanz/pfad" -> Wert
let ST = {cerbo:"Verbinde ...", online:false, shr:"", shr_enabled:false, portal_id:""};
let LITHIUM = {}, LEVEL = null, AC = null, GUARD = null;
let APPVER = null, UPD = null, CHANGELOG = [], REBOOT_MSG = "";
const appVersion = () => ST.app_version || (CHANGELOG[0] && CHANGELOG[0].version) || "";
const BATSCAN = {open: false, busy: false, found: [], searched: false};
let WX = null, PLACE = "";
let ws = null, DEMO = false, holding = 0;

const v = p => V[p];
const n = p => { const x = V[p]; return typeof x === "number" ? x : null; };
function instances(service){
  const s = new Set();
  const pre = service + "/";
  for (const k in V) if (k.startsWith(pre)) s.add(k.split("/")[1]);
  return [...s].sort((a,b)=>a-b);
}
const sv = (svc,i,p) => V[`${svc}/${i}/${p}`];
const sn = (svc,i,p) => { const x = sv(svc,i,p); return typeof x === "number" ? x : null; };
const add = (...a) => { let r = null; for (const x of a) if (x != null) r = (r || 0) + x; return r; };
function devName(svc,i){
  return sv(svc,i,"CustomName") || sv(svc,i,"ProductName") || `${svc} ${i}`;
}

// Zahlen deutsch formatieren
function f(x, d=0, unit=""){
  if (x == null || isNaN(x)) return `--${unit?`<span class="u">${unit}</span>`:""}`;
  const s = Number(x).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
  return unit ? `${s}<span class="u">${unit}</span>` : s;
}
function fp(x, d=0, unit=""){ return (x==null||isNaN(x)) ? "--" : Number(x).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d}) + (unit?" "+unit:""); }
function fW(w){ if (w==null) return f(null,0,"W"); return Math.abs(w)>=1000 ? f(w/1000,2,"kW") : f(w,0,"W"); }
function fWp(w){ if (w==null) return "--"; return Math.abs(w)>=1000 ? fp(w/1000,2,"kW") : fp(w,0,"W"); }
function ttg(s){ if (s==null||s<=0) return "--"; const m=Math.round(s/60); return `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const T_STATE = {0:"Aus",1:"Stromsparen",2:"Fehler",3:"Bulk",4:"Absorption",5:"Erhaltung",6:"Speicher",7:"Ausgleich",8:"Durchleitung",9:"Wechselrichter",10:"Unterstützung",11:"Netzteil",245:"Wartet",247:"Ausgleich",252:"Extern gesteuert"};
const T_MODE = {1:"Nur Laden",2:"Nur Wechselrichter",3:"AN",4:"AUS"};
const T_SRC = {0:"--",1:"Netz",2:"Generator",3:"Landstrom",240:"Nicht verbunden"};
const T_FLUID = {0:"Kraftstoff",1:"Frischwasser",2:"Grauwasser",3:"Livewell",4:"Öl",5:"Schwarzwasser",6:"Benzin",7:"Diesel",8:"Gas",9:"LNG",10:"Hydrauliköl",11:"Rohwasser"};
const C_FLUID = {0:"#ffc233",1:"#3ba3ff",2:"#8a9bb0",5:"#a0785a",6:"#ffc233",7:"#ffc233",8:"#ff8a3d"};
const T_DI = {0:"Aus",1:"An",2:"Aus",3:"An",4:"Nein",5:"Ja",6:"Offen",7:"Geschlossen",8:"OK",9:"Alarm",10:"Läuft",11:"Gestoppt"};
const T_GEN = {0:"Gestoppt",1:"Läuft",2:"Aufwärmen",3:"Abkühlen",4:"Stoppt",10:"Fehler"};

// ===========================================================================
// Verbindung zum Backend
// ===========================================================================
let PUSH_MSG = "";
const ON_PI = location.protocol === "http:";
function connect(){
  let opened = false;
  try { ws = new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws`); }
  catch(e){ startDemo(); return; }
  ws.onopen = () => { opened = true; };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (exMessage(m) || lgMessage(m) || vcMessage(m) || snMessage(m)) {}
    else if (m.type === "snapshot") { for (const k in V) delete V[k]; Object.assign(V, m.values); }
    else if (m.type === "delta") Object.assign(V, m.values);
    else if (m.type === "status") {
      ST = m;
      // nach einem Update hat der Server eine neue Version -> Seite neu laden
      if (m.version) { if (APPVER && APPVER !== m.version) location.reload(); APPVER = m.version; }
    }
    else if (m.type === "update") UPD = m.update;
    else if (m.type === "changelog") CHANGELOG = m.changelog;
    else if (m.type === "reboot_result") REBOOT_MSG = m.msg;
    else if (m.type === "push_result") PUSH_MSG = (m.ok ? "✓ Test-Push gesendet – kommt er nicht an, in der ntfy-App den Kanal abonnieren: " : "✗ " + m.msg + (m.topic ? " – Kanal: " : "")) + (m.topic || "");
    else if (m.type === "pin_result") { if (m.ok) pinClose(); else { PIN.val = ""; PIN.msg = "Falsche PIN"; pinRender(); } }
    else if (m.type === "weather") { WX = m.weather; PLACE = m.place; }
    else if (m.type === "lithium") LITHIUM = m.lithium;
    else if (m.type === "batscan") { BATSCAN.busy = m.busy; BATSCAN.found = m.found; BATSCAN.searched = true; }
    else if (m.type === "level") LEVEL = m.level;
    else if (m.type === "ac") AC = m.ac;
    else if (m.type === "alarms") ALARMS = m.alarms;
    else if (m.type === "guard") { GUARD = m.guard; if (!GUARD.triggered) guardShown = false; }
    schedule();
  };
  // Auf dem Pi (http) nie in den Demo-Modus fallen, sondern immer wieder neu verbinden
  // (z. B. beim Hochfahren oder während eines Updates ist der Server kurz weg).
  ws.onclose = () => { if (DEMO) return; if (!opened && !ON_PI) startDemo(); else setTimeout(connect, 3000); };
  setTimeout(() => { if (!opened && !DEMO && !ON_PI) { try{ws.close();}catch(e){} startDemo(); } }, 2500);
}
function send(msg){
  if (DEMO) { demoCommand(msg); schedule(); return; }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}
const write = (path, value) => send({type:"write", path, value});

// ===========================================================================
// Halten-zum-Schalten
// ===========================================================================
function holdBtn(label, action, cls="", disabled=false){
  return `<button class="btn ${cls}" data-hold="${esc(action)}" ${disabled?"disabled":""}><i class="fill"></i><span>${label}</span></button>`;
}
document.addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-hold]");
  if (!b || b.disabled) return;
  holding++;
  b.classList.add("holding");
  const t = setTimeout(() => { done(); runAction(b.dataset.hold); }, 900);
  const done = () => { clearTimeout(t); b.classList.remove("holding"); holding = Math.max(0, holding-1);
    removeEventListener("pointerup", done); removeEventListener("pointercancel", done); };
  addEventListener("pointerup", done); addEventListener("pointercancel", done);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tap]");
  if (b && !b.disabled) runAction(b.dataset.tap);
});
function runAction(a){
  const [cmd, ...p] = a.split("|");
  if (exAction(cmd, p) || lgAction(cmd, p) || vcAction(cmd, p) || snAction(cmd, p)) { schedule(); return; }
  if (cmd === "w") write(p[0], Number(p[1]));
  else if (cmd === "shr") send({type:"shr", cmd:p[0]});
  else if (cmd === "limit") limitStep(Number(p[0]), p[1]);
  else if (cmd === "limitset") limitSet(Number(p[0]), p[1]);
  else if (cmd === "page") show(p[0]);
  else if (cmd === "dev") { selDev = p[0]; schedule(); }
  else if (cmd === "levelcal") send({type:"level_cal"});
  else if (cmd === "bat") batAction(p);
  else if (cmd === "fs") fsToggle();
  else if (cmd === "reboot") { REBOOT_MSG = "Der Pi startet neu ..."; send({type: "reboot"}); }
  else if (cmd === "sto") { ST.screen_timeout_min = Number(p[0]); send({type: "screen_timeout", value: Number(p[0])}); sleepReset(); }
  else if (cmd === "rollback") { send({type: "rollback"}); UPD = Object.assign({}, UPD, {status: "Wechsle zur vorherigen Version ..."}); }
  else if (cmd === "upd") { send({type: "update_check", apply: true}); UPD = Object.assign({}, UPD, {status: "Suche ..."}); }
  else if (cmd === "guard") send({type:"guard", armed: p[0] === "1"});
  else if (cmd === "guardtest") { PUSH_MSG = DEMO ? "Demo-Modus: keine Verbindung zum Pi" : "Sende …"; send({type:"guard_test"}); schedule(); }
  else if (cmd === "ac") { const v = p[0] === "target" ? Number(p[1]) : (p[0] === "mode" || p[0] === "fan") ? p[1] : p[1] === "1"; acSend({[p[0]]: v}); }
  else if (cmd === "tm" || cmd === "alf" || cmd === "al") clockAction(cmd, p[0], p[1]);
  else if (cmd === "ring") ringStop(p[0] === "snooze");
  else if (cmd === "radio") { unlockAudio(); radioAction(p[0], p[1]); }
  else if (cmd === "rsearch") { radioSearch(); }
  schedule();
}

// Landstrom-Begrenzung: Schritte sammeln, 1,5 s nach dem letzten Tippen senden
let limitPending = null, limitTimer = null;
function limitStep(d, inst){
  const cur = limitPending ?? sn("vebus",inst,"Ac/ActiveIn/CurrentLimit") ?? 16;
  limitSet(Math.min(50, Math.max(1, cur + d)), inst);
}
function limitSet(val, inst){
  limitPending = val;
  clearTimeout(limitTimer);
  limitTimer = setTimeout(() => { write(`vebus/${inst}/Ac/ActiveIn/CurrentLimit`, limitPending); setTimeout(()=>{limitPending=null;schedule();},4000); }, 1500);
}

};

// Wetter-Symbole nach WMO-Code
function wxIcon(code, day=1){
  const sun = day ? '<circle cx="24" cy="22" r="9" fill="#ffc233"/><g stroke="#ffc233" stroke-width="3" stroke-linecap="round"><path d="M24 5v4M24 35v4M7 22h4M37 22h4M12 10l3 3M36 10l-3 3M12 34l3-3M36 34l-3-3"/></g>'
                  : '<path d="M30 8a13 13 0 1 0 10 19A11 11 0 0 1 30 8z" fill="#d6dcff"/>';
  const cloud = (c="#cfd8e3") => `<path d="M16 46h26a9 9 0 0 0 0-18 12 12 0 0 0-23 3 8 8 0 0 0-3 15z" fill="${c}"/>`;
  const drops = '<g stroke="#3ba3ff" stroke-width="3" stroke-linecap="round"><path d="M20 50l-2 6M29 50l-2 6M38 50l-2 6"/></g>';
  const flakes = '<g fill="#fff"><circle cx="20" cy="54" r="2.5"/><circle cx="29" cy="57" r="2.5"/><circle cx="38" cy="54" r="2.5"/></g>';
  const bolt = '<path d="M30 46l-6 9h6l-3 7 9-11h-6l3-5z" fill="#ffc233"/>';
  let g;
  if (code === 0) g = `<g transform="translate(8,10)">${sun}</g>`;
  else if (code <= 2) g = `<g transform="translate(-2,0) scale(.85)">${sun}</g>${cloud()}`;
  else if (code === 3) g = cloud("#aab6c4");
  else if (code <= 48) g = `${cloud("#aab6c4")}<g stroke="#aab6c4" stroke-width="3" stroke-linecap="round"><path d="M12 54h36M16 60h28"/></g>`;
  else if (code <= 67 || (code >= 80 && code <= 82)) g = cloud("#aab6c4") + drops;
  else if (code <= 77 || code === 85 || code === 86) g = cloud() + flakes;
  else g = cloud("#8a96a6") + bolt;
  return `<svg viewBox="0 0 64 64">${g}</svg>`;
}
const WX_TXT = c => c===0?"Klar":c<=2?"Teils bewölkt":c===3?"Bedeckt":c<=48?"Nebel":c<=57?"Niesel":c<=67?"Regen":c<=77?"Schnee":c<=82?"Schauer":c<=86?"Schneeschauer":"Gewitter";

  `<button data-tap="page|${p.id}" id="nav-${p.id}"><svg viewBox="0 0 24 24">${IC[p.ic]}</svg>${p.t}</button>`).join("");

function show(id){
  cur = id;
  document.getElementById("stage").classList.toggle("full", id === "start");
  for (const p of PAGES) {
    document.getElementById("pg-"+p.id).classList.toggle("on", p.id === id);
    document.getElementById("nav-"+p.id).classList.toggle("on", p.id === id);
  }
  schedule(true);
}

// Seite neu zeichnen (Scrollposition bleibt erhalten)
function paint(id, html){
  const el = document.getElementById("pg-"+id);
  const keep = {};
  el.querySelectorAll("[data-keep]").forEach(s => keep[s.dataset.keep] = s.scrollTop);
  el.innerHTML = html;
  el.querySelectorAll("[data-keep]").forEach(s => { if (keep[s.dataset.keep]) s.scrollTop = keep[s.dataset.keep]; });
}

// Hologramm-Ansicht des Dethleffs XXL A (Seitenansicht, Röntgen-Stil).
// Fahrzeug in eigenen Koordinaten gezeichnet, dann skaliert und verschoben.
const SC = 0.9, OX = 58.8, OY = 112;
const P = (x, y) => [x * SC + OX, y * SC + OY];

  {id:"coBatt",  t:"AUFBAUBATTERIE", a:[735,437], b:[630,626,180,76], go:"batt"},
  {id:"coMulti", t:"MULTIPLUS",      a:[950,398], b:[830,626,180,76], go:"ac"},
];
const HUD_BTNS = [["level","NIVEAU"],["klima","KLIMA"],["radio","RADIO"],["clock","UHR · WECKER"]];

function hudFrame(w, h, c = 10){ return `M${c} 0 H${w} V${h - c} L${w - c} ${h} H0 V${c} Z`; }

function calloutSvg(co){
  const [ax, ay] = P(...co.a), [x, y, w, h] = co.b;
  let bx, by, d;
  if (y + h < ay - 20)      { bx = x + w / 2; by = y + h; d = `M${ax} ${ay} V${by + 18} H${bx} V${by}`; }
  else if (y > ay + 20)     { bx = x + w / 2; by = y;     d = `M${ax} ${ay} V${by - 16} H${bx} V${by}`; }
  else                      { bx = x + w;     by = y + h / 2; d = `M${ax} ${ay} V${by} H${bx}`; }
  return `<path class="coLine" d="${d}"/><circle class="coDot" cx="${ax}" cy="${ay}" r="4"/>
    <g class="hud" transform="translate(${x},${y})" ${co.go ? `data-tap="page|${co.go}"` : ""}>
      <path d="${hudFrame(w, h)}" class="hudFrame"/>

// Hintergrund-Netz (fest, damit es nicht flackert)
function constellation(){
  let s = 7, r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const pts = Array.from({length: 46}, () => [r() * 1188, r() * 300 + 10]);
  let o = "";
  pts.forEach((p, i) => { const q = pts[(i * 7 + 3) % pts.length];
    if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 260) o += `<line x1="${p[0]|0}" y1="${p[1]|0}" x2="${q[0]|0}" y2="${q[1]|0}"/>`; });
  return `<g class="net">${o}${pts.map(p => `<circle cx="${p[0]|0}" cy="${p[1]|0}" r="1.6"/>`).join("")}</g>`;
}

// ===========================================================================
// 3D-Startseite: Dethleffs Globetrotter XXL A als Hologramm-Modell (three.js), Alkoven
// Maße nach Herstellerangaben: Länge 8,86 m, Breite 2,35 m, Höhe 3,45 m,
// Radstand 4,75 m, Iveco Daily mit Zwillingsbereifung hinten, Doppelboden,
// Alkoven über dem Iveco-Fahrerhaus, Einzelbetten hinten über der Garage,
// Garagenklappen beidseitig, Fenster mit dunklen Trapez-Rahmen (nach Fotos).
// Koordinaten: x = Länge (Bug bei 0), y = Höhe, z = Breite (rechte Seite = -z)
// ===========================================================================
const HAS3D = (() => { try { return !!window.THREE && !!document.createElement("canvas").getContext("webgl"); } catch (e) { return false; } })();
const L = 8.86, HB = 2.25;               // Länge, Kastenbreite ohne Rundung
const W = (x, y, z) => new THREE.Vector3(x - L / 2, y, z);
let G = null;                            // 3D-Szene und Teile

function glowTex(){
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.25, "rgba(255,255,255,.7)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function build3D(canvas){
  const T = THREE;
  const renderer = new T.WebGLRenderer({canvas, antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
  renderer.setSize(1188, 720, false);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(27, 1188 / 720, 0.1, 100);
  scene.add(new T.HemisphereLight(0xbff6ff, 0x061626, 0.9));
  const dl = new T.DirectionalLight(0xffffff, 0.8); dl.position.set(-6, 10, -8); scene.add(dl);
  const root = new T.Group(); scene.add(root);
  const CY = 0x5fe9ff;

  const glass = (c = CY, o = .16) => new T.MeshStandardMaterial({color: c, transparent: true, opacity: o, roughness: .2, metalness: .1, emissive: c, emissiveIntensity: .12, depthWrite: false, side: T.DoubleSide});
  const solid = (c, e = .25, o = 1) => new T.MeshStandardMaterial({color: c, emissive: c, emissiveIntensity: e, roughness: .5, transparent: o < 1, opacity: o});
  const edgeMat = (c = CY, o = .9) => new T.LineBasicMaterial({color: c, transparent: true, opacity: o});
  const edges = (geo, c, o, ang = 25) => new T.LineSegments(new T.EdgesGeometry(geo, ang), edgeMat(c, o));
  function box(x0, x1, y0, y1, z0, z1, mat, edgeC, edgeO = .7){
    const g = new T.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
    g.translate((x0 + x1) / 2 - L / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    const m = new T.Mesh(g, mat); root.add(m);
    if (edgeC != null) root.add(edges(g, edgeC, edgeO));
    return m;
  }

  // ---- Wohnaufbau mit Alkoven (Seitenprofil nach Fotos, extrudiert) ----
  // Bug bei x = 0. Fahrerhaus bis 2,57 m, Alkovennase bei 0,69 m, Dach 3,35 m.
  const s = new T.Shape();
  s.moveTo(2.57, 0.50);
  s.lineTo(2.57, 2.22);                                    // Rückwand Fahrerhaus
  s.lineTo(1.05, 2.22);                                    // Alkovenboden
  s.quadraticCurveTo(0.74, 2.24, 0.70, 2.50);              // Alkovennase unten
  s.quadraticCurveTo(0.66, 2.86, 0.92, 3.12);              // Nase vorne
  s.quadraticCurveTo(1.30, 3.38, 2.10, 3.36);              // Übergang zum Dach
  s.lineTo(8.62, 3.36); s.quadraticCurveTo(8.86, 3.36, 8.86, 3.10);
  s.lineTo(8.86, 0.66); s.quadraticCurveTo(8.86, 0.50, 8.70, 0.50);
  s.lineTo(6.62, 0.50); s.absarc(6.05, 0.47, 0.55, 0, Math.PI, false);
  s.lineTo(2.57, 0.50);
  const bodyGeo = new T.ExtrudeGeometry(s, {depth: HB, bevelEnabled: true, bevelThickness: .05, bevelSize: .05, bevelSegments: 3, steps: 1, curveSegments: 20});
  bodyGeo.translate(-L / 2, 0, -HB / 2);
  const bodyMat = glass(0xe9fbff, .26);
  root.add(new T.Mesh(bodyGeo, bodyMat));
  root.add(edges(bodyGeo, CY, .95, 30));
  const ZS = HB / 2 + .052;               // Außenseite Aufbau

  // ---- Fahrerhaus Iveco Daily (schmaler, eigene Form) ----
  const cs = new T.Shape();
  cs.moveTo(0.06, 0.32);
  cs.lineTo(-0.02, 0.50); cs.lineTo(0.00, 0.98);           // Stoßfänger, Grill
  cs.quadraticCurveTo(0.10, 1.12, 0.45, 1.24);             // Motorhaube vorne
  cs.lineTo(0.92, 1.42);                                   // Haube
  cs.lineTo(1.55, 2.12); cs.quadraticCurveTo(1.62, 2.20, 1.75, 2.20); // Windschutzscheibe
  cs.lineTo(2.62, 2.20); cs.lineTo(2.62, 0.50);
  cs.lineTo(1.55, 0.50); cs.absarc(1.00, 0.45, 0.55, 0, Math.PI, false);
  cs.lineTo(0.30, 0.34); cs.lineTo(0.06, 0.32);
  const CW = 1.96;
  const cabGeo = new T.ExtrudeGeometry(cs, {depth: CW, bevelEnabled: true, bevelThickness: .08, bevelSize: .06, bevelSegments: 3, steps: 1, curveSegments: 16});
  cabGeo.translate(-L / 2, 0, -CW / 2);
  root.add(new T.Mesh(cabGeo, glass(0xf2fcff, .30)));
  root.add(edges(cabGeo, CY, .9, 30));
  const ZC = CW / 2 + .082;
  // Windschutzscheibe
  const ws = new T.BufferGeometry();

  ws.setFromPoints([wv[0], wv[1], wv[2], wv[0], wv[2], wv[3]]); ws.computeVertexNormals();
  const winMat = new T.MeshStandardMaterial({color: 0x0b2f4f, emissive: 0x2a8fd0, emissiveIntensity: .35, transparent: true, opacity: .82, roughness: .05, side: T.DoubleSide});
  root.add(new T.Mesh(ws, winMat));
  root.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(wv), edgeMat(CY, 1)));
  // Scheinwerfer (schmal, nach außen gezogen), Grill, Stoßfänger
  for (const z of [-1, 1]) {
    box(0.02, 0.30, 1.00, 1.10, z * 0.58, z * 0.95, solid(0xe8fbff, 1.4));

  }

  box(-0.06, 0.10, 0.32, 0.55, -1.0, 1.0, solid(0x1a2c3a, .2), CY, .5);             // Stoßfänger

  // ---- Flächen auf den Seiten ----
  function sidePoly(pts, side, mat, lineC, z = ZS){
    const sh = new T.Shape(pts.map(p => new T.Vector2(p[0], p[1])));
    const g = new T.ShapeGeometry(sh);
    g.translate(-L / 2, 0, 0);
    const m = new T.Mesh(g, mat);
    m.position.z = side * (z + .004);
    root.add(m);
    if (lineC != null) { const e = edges(g, lineC, .9); e.position.z = m.position.z; root.add(e); }
    return m;
  }
  const rect = (x0, y0, x1, y1, r = .06) => {
    const p = []; const seg = 4;
    const c = [[x1 - r, y0 + r, -Math.PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, Math.PI / 2], [x0 + r, y0 + r, Math.PI]];
    for (const [cx, cy, a0] of c) for (let k = 0; k <= seg; k++) { const a = a0 + k / seg * Math.PI / 2; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    return p;
  };
  const frameMat = new T.MeshBasicMaterial({color: 0x3a4652, transparent: true, opacity: .85, side: T.DoubleSide});   // dunkle Fensterrahmen-Grafik
  const panelMat = glass(0xdff6ff, .14);
  const lineMat = new T.MeshBasicMaterial({color: 0x0a0f14, transparent: true, opacity: .95, side: T.DoubleSide});
  const greyMat = new T.MeshBasicMaterial({color: 0x8c99a6, transparent: true, opacity: .7, side: T.DoubleSide});
  // Fenster mit schrägem dunklem Rahmen (Trapez wie am Fahrzeug)
  const trapWin = (x0, x1, y0, y1, side, slant = .22) => {
    sidePoly([[x0 - .12 - slant, y0 - .08], [x1 + .12, y0 - .08], [x1 + .12, y1 + .08], [x0 - .12, y1 + .08]], side, frameMat);
    sidePoly(rect(x0, y0, x1, y1, .05), side, winMat, CY, ZS + .003);
  };
  // Dekorlinie: steigt vom Fahrerhaus zum Heck an
  const decor = (side) => {
    const band = (dy, h, m) => sidePoly([[2.57, 1.52 + dy], [8.86, 2.20 + dy], [8.86, 2.20 + dy + h], [2.57, 1.52 + dy + h]], side, m);
    band(0, .035, lineMat); band(-.09, .02, greyMat);
    sidePoly([[0.95, 1.30], [2.62, 1.52], [2.62, 1.555], [0.95, 1.335]], side, lineMat, null, ZC);
  };
  // rechte Seite (-z): Alkovenfenster, Wohnraumfenster, Tür, zwei Heckfenster, Garagenklappe
  trapWin(1.30, 2.18, 2.66, 3.02, -1, .25);
  trapWin(2.85, 3.62, 2.02, 2.62, -1);
  sidePoly(rect(4.31, 0.62, 5.00, 2.62, .05), -1, panelMat, CY);
  sidePoly(rect(4.40, 1.62, 4.90, 2.42, .05), -1, winMat, null, ZS + .003);
  trapWin(6.25, 6.80, 2.06, 2.58, -1, .15);

  sidePoly(rect(7.75, 0.60, 8.68, 1.75, .04), -1, panelMat, CY);
  sidePoly(rect(5.85, 2.70, 6.30, 2.92, .03), -1, panelMat, CY);           // Lüftungsgitter
  sidePoly(rect(5.85, 1.42, 6.30, 1.64, .03), -1, panelMat, CY);

  sidePoly(rect(7.70, 0.60, 8.62, 1.90, .04), 1, panelMat, CY);
  for (const side of [-1, 1]) {

    // Serviceklappen unten

  // Trittstufe unter der Tür, Landstromdose
  box(4.35, 4.95, 0.28, 0.32, -ZS - .45, -ZS - .05, solid(0x9fefff, .5), CY, .9);
  const sock = box(3.85, 3.98, 1.05, 1.18, -ZS - .03, -ZS, solid(0x38e8ff, .9));
  // Heck: Rückleuchten, Markise rechts oben, Dachreling
  for (const z of [-1.06, 1.06]) box(8.86, 8.90, 0.70, 1.60, z - .06, z + .06, solid(0xff3040, 1.2));
  box(1.95, 8.30, 3.14, 3.30, -ZS - .16, -ZS, solid(0xdff6ff, .25, .9), CY, .8);
  for (const z of [-1.0, 1.0]) box(3.4, 8.5, 3.40, 3.44, z - .02, z + .02, solid(0x9fefff, .4), CY, .5);

  // ---- Dach: Klimaanlage (vorne, über dem Alkoven-Ende), Solar, Antenne ----
  const pvMat = solid(0x1d4fd8, .35);
  G = {renderer, scene, cam, root, parts: {}};

  for (const [x0, x1] of [[3.55, 5.15], [5.30, 6.90], [7.05, 8.40]]) {

  const acDome = new T.SphereGeometry(0.5, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2);

  box(2.62, 2.66, 3.36, 4.35, 0.55, 0.59, solid(0x9fefff, .4), CY, .6);            // Antenne
  box(4.0, 4.6, 3.40, 3.52, 0.25, 0.85, glass(0xbff6ff, .35), CY, .8);            // Dachhaube

  // ---- Innenraum (angedeutet) ----

  box(1.75, 2.45, 0.60, 1.20, -0.85, -0.15, intM, intE, .6);               // Beifahrersitz
  box(1.75, 2.45, 0.60, 1.20, 0.15, 0.85, intM, intE, .6);                 // Fahrersitz

  box(2.70, 3.15, 0.97, 1.45, 0.30, 1.08, intM, intE, .6);                 // Sitzbank
  box(3.95, 4.35, 0.97, 1.45, 0.30, 1.08, intM, intE, .6);                 // Sitzbank
  box(3.20, 3.90, 1.70, 1.75, 0.30, 1.05, solid(0x9fefff, .4, .6), intE, .8); // Tisch
  box(2.70, 3.80, 0.97, 1.45, -1.08, -0.60, intM, intE, .6);               // Längsbank
  box(4.45, 5.20, 0.97, 1.85, 0.50, 1.08, intM, intE, .7);                 // Küche
  box(5.05, 5.65, 0.97, 3.25, -1.08, -0.45, intM, intE, .8);               // Kühlschrank raumhoch
  box(5.75, 6.65, 0.97, 3.25, -1.08, 1.08, glass(0x9fefff, .07), intE, .5); // Bad
  box(6.70, 8.80, 1.80, 2.00, -1.05, -0.12, intM, intE, .7);               // Einzelbett rechts
  box(6.70, 8.80, 1.80, 2.00, 0.12, 1.05, intM, intE, .7);                 // Einzelbett links
  box(6.70, 8.80, 0.97, 1.80, -1.1, 1.1, glass(CY, .05), intE, .45);       // Garage

  // ---- Doppelboden: Tanks, Batterie, MultiPlus ----
  const shell = (x0, x1, y0, y1, z0, z1, c) => box(x0, x1, y0, y1, z0, z1, glass(c, .12), c, .9);
  const fill = (x0, x1, y0, y1, z0, z1, c) => { const m = box(x0, x1, y0, y1, z0, z1, solid(c, .6, .9)); m.userData = {y0, h: y1 - y0}; return m; };
  shell(2.75, 3.95, 0.55, 0.90, -0.55, 0.55, 0x3ba3ff);
  G.parts.fresh = fill(2.78, 3.92, 0.57, 0.88, -0.52, 0.52, 0x3ba3ff);
  shell(4.10, 5.20, 0.55, 0.90, -0.55, 0.55, 0x9fb4c8);
  G.parts.grey = fill(4.13, 5.17, 0.57, 0.88, -0.52, 0.52, 0x9fb4c8);
  shell(5.35, 6.05, 0.55, 0.90, 0.15, 0.95, 0x34e39b);
  G.parts.batt = fill(5.38, 6.02, 0.57, 0.88, 0.18, 0.92, 0x34e39b);
  box(7.05, 7.55, 1.0, 1.42, -1.0, -0.55, solid(0x1d6fe0, .7), 0x9fd0ff, 1);   // MultiPlus in der Garage

  // ---- Fahrgestell, Räder (vorne einfach, hinten Zwilling), Stützen ----
  box(0.6, 8.3, 0.30, 0.45, -0.55, -0.40, solid(0x163447, .2), CY, .3);
  box(0.6, 8.3, 0.30, 0.45, 0.40, 0.55, solid(0x163447, .2), CY, .3);
  function wheel(x, z, w = .22){
    const g = new T.CylinderGeometry(.372, .372, w, 32); g.rotateX(Math.PI / 2); g.translate(x - L / 2, .372, z);
    root.add(new T.Mesh(g, solid(0x07131d, .05)));
    root.add(edges(g, CY, .9, 40));
    const h = new T.CylinderGeometry(.21, .21, w + .01, 24); h.rotateX(Math.PI / 2); h.translate(x - L / 2, .372, z);
    root.add(new T.Mesh(h, solid(0xcfe9f5, .5)));
  }
  for (const z of [-1, 1]) { wheel(1.00, z * 0.88); wheel(6.05, z * 1.02); wheel(6.05, z * .78); }
  G.parts.jacks = [];
  for (const [x, z] of [[0.55, -0.85], [0.55, 0.85], [8.35, -0.9], [8.35, 0.9]]) {
    const g = new T.CylinderGeometry(.06, .06, 1, 12); g.translate(0, -.5, 0);
    const m = new T.Mesh(g, solid(0x5fe9ff, .8)); m.position.copy(W(x, x < 1 ? .34 : .45, z)); m.scale.y = .05;
    const foot = new T.Mesh(new T.CylinderGeometry(.14, .14, .03, 16), solid(0x5fe9ff, .8));
    m.add(foot); foot.position.y = -1;
    root.add(m); G.parts.jacks.push(m);
  }

  // ---- Plattform ----
  const ph = new T.Shape([[-6.4, 0], [-5.4, -2.7], [5.4, -2.7], [6.4, 0], [5.4, 2.7], [-5.4, 2.7]].map(p => new T.Vector2(p[0], p[1])));
  const pg = new T.ExtrudeGeometry(ph, {depth: .28, bevelEnabled: false}); pg.rotateX(Math.PI / 2); pg.translate(0, -.01, 0);
  scene.add(new T.Mesh(pg, new T.MeshStandardMaterial({color: 0x0d3550, emissive: 0x0a3a5a, emissiveIntensity: .5, transparent: true, opacity: .85})));
  const pe = edges(pg, 0x38e8ff, 1, 10); scene.add(pe); G.parts.platEdge = pe;
  const ring = new T.Mesh(new T.RingGeometry(5.6, 5.75, 6, 1), new T.MeshBasicMaterial({color: 0x38e8ff, transparent: true, opacity: .5, side: T.DoubleSide}));
  ring.rotation.x = -Math.PI / 2; ring.scale.set(1.12, .52, 1); ring.position.y = .005; scene.add(ring);
  const grid = new T.GridHelper(40, 40, 0x1b6d8f, 0x0e3b52); grid.position.y = -.3; grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);

  // ---- Leuchtpunkte: Licht, Energieflüsse ----
  const tex = glowTex();
  const spr = (c, s) => { const m = new T.Sprite(new T.SpriteMaterial({map: tex, color: c, blending: T.AdditiveBlending, transparent: true, depthWrite: false})); m.scale.set(s, s, s); root.add(m); return m; };
  G.parts.lamp = spr(0xffd27a, 1.6); G.parts.lamp.position.copy(W(3.55, 2.9, 0.4));
  G.parts.pvGlow = spr(0xffc233, 5); G.parts.pvGlow.position.copy(W(6.0, 3.6, -0.5)); G.parts.pvGlow.scale.set(6.5, 1.4, 1);
  sock.userData.glow = spr(0x38e8ff, .5); sock.userData.glow.position.copy(W(3.92, 1.12, -ZS - .06));
  const path = pts => pts.map(p => W(...p));
  G.flows = {};
  const mkFlow = (k, pts, c) => { const P = path(pts); const seg = [];
    let tot = 0; for (let i = 1; i < P.length; i++) { const d = P[i].distanceTo(P[i - 1]); seg.push(d); tot += d; }
    G.flows[k] = {P, seg, tot, dots: Array.from({length: 9}, () => spr(c, .22)), on: false, rev: false, speed: 1, t: 0}; };
  mkFlow("pv",    [[5.1, 3.40, -0.5], [5.1, 2.4, -0.3], [5.6, 0.95, 0.4], [5.7, 0.80, 0.55]], 0xffc233);
  mkFlow("shore", [[3.92, 1.12, -1.2], [5.5, 0.95, -0.95], [7.05, 1.2, -0.8]], 0x38e8ff);
  mkFlow("multi", [[7.05, 1.2, -0.75], [6.4, 0.95, 0.2], [6.0, 0.75, 0.5]], 0x3ba3ff);
  mkFlow("load",  [[5.4, 0.80, 0.55], [4.6, 1.2, 0.5], [3.7, 2.4, 0.45], [3.55, 2.85, 0.4]], 0xff8f8f);

  // Bezugspunkte für die Beschriftungen
  G.anchors = {
    coInnen: W(3.55, 1.75, 0.6), coSolar: W(4.35, 3.45, -0.55), coKuehl: W(5.35, 2.4, -0.8),
    coShore: W(3.92, 1.12, -ZS), coJack: W(0.55, 0.15, -0.85),
    coFresh: W(3.35, 0.7, -0.55), coGrey: W(4.65, 0.7, -0.55), coBatt: W(5.7, 0.7, 0.2), coMulti: W(7.3, 1.2, -1.0),
  };
  G.az = 0; G.drag = null; G.idle = 0;
  return G;
}

function place3DCamera(t){
  // Blick schräg von vorn rechts, leichtes Schwenken; Ziehen mit dem Finger dreht
  const base = -2.42 + (G.drag ? 0 : Math.sin(t / 9000) * .10);
  const a = base + G.az, r = 15.2;
  G.cam.position.set(Math.cos(a) * r + 0.3, 5.0, Math.sin(a) * r);
  G.cam.lookAt(0.3, 1.25, 0);
}

function flowPos(f, u){
  let d = u * f.tot;
  for (let i = 0; i < f.seg.length; i++) { if (d <= f.seg[i]) return f.P[i].clone().lerp(f.P[i + 1], d / f.seg[i]); d -= f.seg[i]; }
  return f.P[f.P.length - 1].clone();
}

function frame3D(now){
  if (!G || cur !== "start" || !document.getElementById("cv3d")) { G && (G.raf = 0); return; }
  G.raf = requestAnimationFrame(frame3D);
  const dt = Math.min(.1, (now - (G.last || now)) / 1000); G.last = now;
  if (!G.drag) G.az *= .985;                        // langsam zurück in die Grundansicht
  place3DCamera(now);
  for (const f of Object.values(G.flows)) {
    f.t = (f.t + dt * .10 * f.speed) % 1;
    f.dots.forEach((d, i) => { d.visible = f.on; if (!f.on) return;
      let u = (f.t + i / f.dots.length) % 1; if (f.rev) u = 1 - u; d.position.copy(flowPos(f, u)); });
  }
  const pulse = .55 + .45 * Math.sin(now / 600);
  G.parts.platEdge.material.opacity = .55 + .45 * pulse;
  G.renderer.render(G.scene, G.cam);
  // Beschriftungslinien an die projizierten Punkte hängen
  for (const co of CALLOUTS) {
    const p = G.anchors[co.id].clone().project(G.cam);
    const ax = (p.x + 1) / 2 * 1188, ay = (1 - p.y) / 2 * 720;
    const [x, y, w, h] = co.b;
    let d;
    if (y + h < ay - 20) { const bx = x + w / 2, by = y + h; d = `M${ax.toFixed(1)} ${ay.toFixed(1)} V${by + 18} H${bx} V${by}`; }
    else if (y > ay + 20) { const bx = x + w / 2; d = `M${ax.toFixed(1)} ${ay.toFixed(1)} V${y - 16} H${bx} V${y}`; }
    else { d = `M${ax.toFixed(1)} ${ay.toFixed(1)} H${x + w + 24} V${y + h / 2} H${x + w}`; }
    const l = document.getElementById(co.id + "L"), c = document.getElementById(co.id + "D");
    if (l) l.setAttribute("d", d);
    if (c) { c.setAttribute("cx", ax.toFixed(1)); c.setAttribute("cy", ay.toFixed(1)); }
  }
}

  paint("start", `<div id="womo" style="position:absolute;inset:0">
    <svg viewBox="0 0 1188 720" width="100%" height="100%" style="position:absolute;inset:0">
      <defs><radialGradient id="hBg" cx="50%" cy="60%" r="75%"><stop offset="0" stop-color="#0f3550"/><stop offset=".55" stop-color="#071a2b"/><stop offset="1" stop-color="#030a12"/></radialGradient></defs>

  ["news", "Nachrichten"], ["oldies", "Oldies"], ["80s", "80er"], ["chillout", "Chillout"], ["jazz", "Jazz"], ["classical", "Klassik"]];
const DEMO_STATIONS = ["1LIVE", "WDR 2", "SWR3", "Antenne Bayern", "Radio Paloma", "Deutschlandfunk", "Rock Antenne", "NDR 2", "bigFM", "Klassik Radio"]
  .map(n => ({name: n, url: "", tags: "Demo", id: n}));
// Sendernamen aufräumen ("# TOP 100 DJ CHARTS - 24/7 ..." -> "Top 100 DJ Charts")
function rClean(n){
  let x = String(n || "").replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu, "");
  x = x.split(/\s+\|\s+|\s+[-–—]{1,2}\s+/).find(t => t.replace(/[^\p{L}\p{N}]/gu, "").length >= 3) || x;
  x = x.replace(/[#_*~|=<>]+/g, " ").replace(/^[\s\-–—.:]+|[\s\-–—.:]+$/g, "").replace(/\s+/g, " ").trim();
  if (x.length > 5 && x === x.toUpperCase() && /[A-ZÄÖÜ]{4}/.test(x))
    x = x.toLowerCase().replace(/(^|[\s(.-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()).replace(/\b(Dj|Fm|Ndr|Wdr|Swr|Mdr|Rbb|Br|Hr|Edm)\b/g, w => w.toUpperCase());
  return x;
}
const RGENRE = {pop: "Pop", rock: "Rock", news: "Nachrichten", oldies: "Oldies", "60s": "60er", "70s": "70er", "80s": "80er", "90s": "90er", "2000s": "2000er",
  dance: "Dance", electronic: "Elektronisch", techno: "Techno", trance: "Trance", house: "House", hiphop: "Hip-Hop", rap: "Rap", jazz: "Jazz", classical: "Klassik",
  schlager: "Schlager", chillout: "Chillout", ambient: "Ambient", lounge: "Lounge", culture: "Kultur", talk: "Talk", charts: "Charts", hits: "Hits", "top 40": "Hits",
  "public radio": "Öffentlich-rechtlich", "public service": "Öffentlich-rechtlich", information: "Info", relax: "Entspannung", metal: "Metal", alternative: "Alternative",
  country: "Country", soul: "Soul", "adult contemporary": "Pop", volksmusik: "Volksmusik", kids: "Kinder", sport: "Sport", regional: "Regional", indie: "Indie", blues: "Blues"};
function rGenre(tags){
  const out = [];
  for (const t of String(tags || "").toLowerCase().split(",").map(x => x.trim())) { const g = RGENRE[t]; if (g && !out.includes(g)) out.push(g); if (out.length === 2) break; }
  return out.join(" · ");
}
async function radioLoad(cat, query){
  RADIO.cat = cat;
  if (cat === "fav") { RADIO.list = RADIO.favs; RADIO.status = RADIO.favs.length ? "" : "Noch keine Favoriten – beim laufenden Sender auf ★ tippen"; schedule(); return; }
  RADIO.status = "Lade Sender ..."; RADIO.list = []; schedule();
  const q = cat === "search" ? `search?name=${encodeURIComponent(query || "")}&` : cat === "top" ? "bycountrycodeexact/DE?" : `search?countrycode=DE&tag=${encodeURIComponent(cat)}&`;
  try {
    const r = await fetch(`https://de1.api.radio-browser.info/json/stations/${q}order=clickcount&reverse=true&limit=100&hidebroken=true`);
    const j = await r.json();
    const seen = new Set(), list = [];
    for (const st of j) {
      const name = rClean(st.name), key = name.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "");
      if (!st.url_resolved || key.length < 2 || seen.has(key)) continue;
      seen.add(key);
      list.push({name, url: st.url_resolved, logo: st.favicon || "", tags: rGenre(st.tags), id: st.stationuuid});
      if (list.length >= 48) break;
    }
    RADIO.list = list;
    RADIO.status = list.length ? "" : "Keine Sender gefunden";
  } catch (e) { RADIO.list = DEMO_STATIONS; RADIO.status = "Senderliste nicht erreichbar (Internet?) – Beispielliste"; }
  schedule();
}
function radioPlay(id){
  const s = RADIO.list.find(x => x.id === id) || RADIO.favs.find(x => x.id === id);
  if (!s) return;
  RADIO.playing = s;
  if (!s.url) { RADIO.status = "Demo: hier wird nichts abgespielt"; schedule(); return; }
  RADIO.audio.src = s.url;
  RADIO.audio.play().then(() => { RADIO.status = ""; schedule(); }).catch(e => { RADIO.status = "Sender lässt sich nicht abspielen"; schedule(); });
}
function radioAction(a, b){
  if (a === "cat") radioLoad(b);
  else if (a === "play") radioPlay(b);
  else if (a === "stop") { RADIO.audio.pause(); RADIO.audio.removeAttribute("src"); RADIO.audio.load(); RADIO.playing = null; }
  else if (a === "vol") { RADIO.vol = Math.max(0, Math.min(1, RADIO.vol + Number(b))); RADIO.audio.volume = RADIO.vol; }
  else if (a === "fav") {
    const s = RADIO.playing; if (!s) return;
    const i = RADIO.favs.findIndex(x => x.id === s.id);
    if (i >= 0) RADIO.favs.splice(i, 1); else RADIO.favs.push(s);
    try { localStorage.setItem("womoRadioFavs", JSON.stringify(RADIO.favs)); } catch (e) {}
  }
}

// Leichtes 3D-Pendeln des Womos um die Hochachse (Antippen hält es an)
const ROT = {A: 4, T: 22, ph: 0, amp: 1, a: 0, last: null, resumeAt: 0, P: 1500, cx: 0, cy: 0};
let IGEOM = [];
function rotProj(x, y){
  const th = ROT.a * Math.PI / 180, dx = x - ROT.cx, dy = y - ROT.cy;
  const f = ROT.P / (ROT.P + dx * Math.sin(th));
  return [ROT.cx + dx * Math.cos(th) * f, ROT.cy + dy * f];
}
function rotPause(){ ROT.resumeAt = performance.now() + 30000; }
function rotStep(now, dt){
  const run = now > ROT.resumeAt;
  ROT.amp += ((run ? 1 : 0) - ROT.amp) * Math.min(1, dt * (run ? .4 : 3));
  if (ROT.amp > .001) ROT.ph += dt * 2 * Math.PI / ROT.T;
  ROT.a = ROT.A * ROT.amp * Math.sin(ROT.ph);
  if (ROT.last !== null && Math.abs(ROT.a - ROT.last) < .003) return false;
  ROT.last = ROT.a;
  const el = document.getElementById("iRot");
  if (el) el.style.transform = `perspective(${ROT.P}px) rotateY(${ROT.a.toFixed(3)}deg)`;
  for (const g of IGEOM) {
    const [x, y] = rotProj(g.ax, g.ay);
    if (!g.L) { g.L = document.getElementById(g.id + "IL"); g.D = document.getElementById(g.id + "ID"); }
    if (g.L) g.L.setAttribute("d", coPath(g, x, y));
    if (g.D) { g.D.setAttribute("cx", x.toFixed(1)); g.D.setAttribute("cy", y.toFixed(1)); }
  }
  for (const n of document.querySelectorAll("#womoImg .iAtt")) {
    const bx = +n.dataset.x, by = +n.dataset.y, [x, y] = rotProj(bx, by);
    n.setAttribute("transform", `translate(${(x - bx).toFixed(1)} ${(y - by).toFixed(1)})`);
  }
  return true;
}

  // Leitungen vorberechnen
  for (const [k, f] of Object.entries(IFLOWS)) {
    f.pts = f.P.map(([x, y]) => [IX(x), IY(y)]);
    f.seg = []; f.tot = 0;
    for (let i = 1; i < f.pts.length; i++) { const d = Math.hypot(f.pts[i][0] - f.pts[i - 1][0], f.pts[i][1] - f.pts[i - 1][1]); f.seg.push(d); f.tot += d; }
    f.dots = [...document.querySelectorAll(`#if_${k} circle`)];
    f.t = 0; f.on = false; f.rev = false; f.speed = 1;
  }
  if (!IFLOWS.raf) IFLOWS.raf = requestAnimationFrame(frameImg);
}

function flowAt(f, u){
  let d = u * f.tot;
  for (let i = 0; i < f.seg.length; i++) {
    if (d <= f.seg[i]) { const a = f.pts[i], b = f.pts[i + 1], r = d / f.seg[i]; return [a[0] + (b[0] - a[0]) * r, a[1] + (b[1] - a[1]) * r]; }
    d -= f.seg[i];
  }
  return f.pts[f.pts.length - 1];
}

function frameImg(now){
  if (cur !== "start" || !document.getElementById("womoImg")) { IFLOWS.raf = 0; return; }
  IFLOWS.raf = requestAnimationFrame(frameImg);
  const dt = Math.min(.1, (now - (IFLOWS.last || now)) / 1000); IFLOWS.last = now;
  rotStep(now, dt);
  for (const f of Object.values(IFLOWS)) {
    if (!f.dots) continue;
    f.t = (f.t + dt * .07 * f.speed) % 1;
    f.dots.forEach((c, i) => {
      if (!f.on) { if (c.getAttribute("cx") !== "-20") { c.setAttribute("cx", -20); c.setAttribute("cy", -20); } return; }
      let u = (f.t + i / f.dots.length) % 1; if (f.rev) u = 1 - u;
      const [x, y] = rotProj(...flowAt(f, u)); c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
    });
  }
}

function exAction(cmd, p){
  if (cmd === "ex" || cmd === "goex") {
    if (cmd === "goex") show("extras");
    EXTAB = p[0]; exEnter(); return true;
  }
  if (cmd === "chk") {
    const [a, i] = p;
    send(a === "toggle" ? {type: "chk_toggle", i: Number(i)} : a === "del" ? {type: "chk_del", i: Number(i)} : {type: "chk_" + a});
    return true;
  }
  if (cmd === "mt") {
    const [a, id, x] = p;
    if (a === "shift") send({type: "mt_shift", id, months: Number(x)});
    else if (a === "int") send({type: "mt_interval", id, months: Number(x)});
    else send({type: "mt_" + a, id});
    return true;
  }
  if (cmd === "mtadd") { exAddMaint(); return true; }
  if (cmd === "mtint") { MT_NEW_INT = Number(p[0]); return true; }
  if (cmd === "chkadd") { exAddCheck(); return true; }
  if (cmd === "trip") { send(p[0] === "del" ? {type: "trip_del", id: p[1]} : {type: "trip_" + p[0]}); return true; }
  if (cmd === "map") { mapCmd(p[0]); return true; }
  if (cmd === "hr") { HRANGE = p[0]; send({type: "history", range: HRANGE}); return true; }
  if (cmd === "wtog") { send({type: "warn_set", key: "toggle", value: p[0]}); return true; }
  if (cmd === "wbool") { send({type: "warn_set", key: p[0], value: !(WCFG && WCFG[p[0]])}); return true; }
  if (cmd === "wset") {
    const cur = WCFG ? Number(WCFG[p[0]]) : 0;
    if (WCFG) WCFG[p[0]] = cur + Number(p[1]);
    send({type: "warn_set", key: p[0], value: cur + Number(p[1])}); return true;
  }
  if (cmd === "en") {
    const k = p[0], d = Number(p[1]);
    if (k === "bat") { const ah = Math.max(50, Math.round((FC && FC.cap_wh || 3840) / 12.8) + d); send({type: "energy_set", battery_wh: ah * 12.8}); }
    if (k === "bat" && FC) FC.cap_wh = Math.max(50, Math.round(FC.cap_wh / 12.8) + d) * 12.8;
    if (k === "pv") { const wp = Math.max(50, (FC && FC.pv_wp) || 400) + d; if (FC) FC.pv_wp = wp; send({type: "energy_set", pv_wp: wp}); }
    return true;
  }
  if (cmd === "loc") { locAction(p); return true; }
  if (cmd === "drv") { DRIVE_ALERT = null; drawDrive(); return true; }
  return false;
}

function exEnter(){
  if (EXTAB === "verlauf") send({type: "history", range: HRANGE});
  if (EXTAB === "reise") { send({type: "trip_get"}); MAP.needFit = true; }
  if (EXTAB === "handy") send({type: "net_info"});
  if (EXTAB === "warn") send({type: "warn_cfg"});
  if (EXTAB === "sprache") send({type: "voice_get"});
  if (EXTAB === "sensoren" || EXTAB === "kamera") { send({type: "sens_get"}); CAM_T = 0; }
  if (EXTAB === "kamera" && SNS && SNS.ha_token && !HA_RES) send({type: "ha_check"});
  schedule(true);
}

function exMessage(m){
  if (m.type === "warnings") WARNS = m.list || [];
  else if (m.type === "forecast") FC = m.forecast && m.forecast.text != null ? m.forecast : FC;
  else if (m.type === "checklist") CHK = m;
  else if (m.type === "maint") MAINT = m.items;
  else if (m.type === "trip") { TRIP = m; mapDraw(); }
  else if (m.type === "history") HISTD[m.range] = m;
  else if (m.type === "net") { NET = m; }
  else if (m.type === "warn_cfg") { WCFG = m.cfg; if (m.names) WNAMES = m.names; }
  else if (m.type === "loc_results") { LOC.busy = false; LOC.res = m.results || []; LOC.err = !!m.error; drawLoc(); }
  else if (m.type === "drive_alert") { DRIVE_ALERT = m; drawDrive(); }
  else return false;
  return true;
}

const MAP = {z: 6, cx: 0, cy: 0, needFit: true, drag: null, W: 700, H: STAGE_H - 160};
const lon2x = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
const lat2y = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * 2 ** z; };
function mapPts(){
  const p = [];
  if (TRIP) { for (const t of TRIP.track) p.push(t); for (const s of TRIP.stays) p.push([s.lat, s.lon]); }
  const L = WX && WX.loc; if (L) p.push([L.lat, L.lon]);
  return p;
}
function mapFit(){
  const p = mapPts();
  if (!p.length) { p.push([51.3, 10.4]); }
  const la = p.map(x => x[0]), lo = p.map(x => x[1]);
  const [a0, a1, o0, o1] = [Math.min(...la), Math.max(...la), Math.min(...lo), Math.max(...lo)];
  let z = 15;
  if (p.length === 1) z = 11;
  else for (; z > 3; z--) if (lon2x(o1, z) - lon2x(o0, z) < MAP.W - 80 && lat2y(a0, z) - lat2y(a1, z) < MAP.H - 80) break;
  MAP.z = z; MAP.cx = (lon2x(o0, z) + lon2x(o1, z)) / 2; MAP.cy = (lat2y(a0, z) + lat2y(a1, z)) / 2; MAP.needFit = false;
}
function mapCmd(c){
  if (c === "fit") { mapFit(); mapDraw(); return; }
  const nz = Math.max(3, Math.min(18, MAP.z + (c === "in" ? 1 : -1)));
  const k = 2 ** (nz - MAP.z); MAP.cx *= k; MAP.cy *= k; MAP.z = nz; mapDraw();
}
function mapBind(){
  const box = document.getElementById("mapBox");
  box.addEventListener("pointerdown", e => { if (e.target.closest(".mapCtl")) return; MAP.drag = {x: e.clientX, y: e.clientY, cx: MAP.cx, cy: MAP.cy}; box.setPointerCapture(e.pointerId); });
  box.addEventListener("pointermove", e => { if (!MAP.drag) return; const s = STAGE_S || 1;
    MAP.cx = MAP.drag.cx - (e.clientX - MAP.drag.x) / s; MAP.cy = MAP.drag.cy - (e.clientY - MAP.drag.y) / s; mapDraw(); });
  const up = () => { MAP.drag = null; }; box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
}
function mapDraw(){
  const tl = document.getElementById("mapTiles"), sv = document.getElementById("mapSvg");
  if (!tl || EXTAB !== "reise") return;
  if (MAP.needFit) mapFit();
  const {z, W, H} = MAP, x0 = MAP.cx - W / 2, y0 = MAP.cy - H / 2, n = 2 ** z;
  let tiles = "";
  for (let ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + H) / 256); ty++) {
    if (ty < 0 || ty >= n) continue;
    for (let tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + W) / 256); tx++) {
      const wx = ((tx % n) + n) % n;
      tiles += `<img src="https://tile.openstreetmap.org/${z}/${wx}/${ty}.png" onerror="this.style.visibility='hidden'" style="left:${Math.round(tx * 256 - x0)}px;top:${Math.round(ty * 256 - y0)}px" alt="">`;
    }
  }
  if (tl.dataset.k !== tiles) { tl.innerHTML = tiles; tl.dataset.k = tiles; }
  const P = (la, lo) => [(lon2x(lo, z) - x0).toFixed(1), (lat2y(la, z) - y0).toFixed(1)];
  let g = "";

function lineChart(pts, series, H, yMin, yMax, unit){
  const W = 740, L = 46, R = 8, T = 10, B = 20;
  if (!pts.length) return "";
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
  const X = t => L + (W - L - R) * (t - t0) / Math.max(1, t1 - t0);
  if (yMax == null) { yMax = 10; for (const p of pts) for (const s of series) if (p[s.k] != null) yMax = Math.max(yMax, p[s.k]); yMax *= 1.1; }
  const Y = v => T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin || 1));
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = yMin + (yMax - yMin) * k / 4, y = Y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#243241"/><text x="${L - 6}" y="${+y + 4}" text-anchor="end">${Math.round(v)}${unit}</text>`; }
  const span = t1 - t0, stepH = span > 2 * 86400 ? 86400 : span > 12 * 3600 ? 4 * 3600 : 3600;
  for (let t = Math.ceil(t0 / stepH) * stepH; t <= t1; t += stepH) { const d = new Date(t * 1000);
    g += `<text x="${X(t).toFixed(1)}" y="${H - 4}" text-anchor="middle">${stepH === 86400 ? WDAY[d.getDay()] : pad(d.getHours()) + ":00"}</text>`; }
  for (const s of series) {
    let d = "", pen = false;
    for (const p of pts) { if (p[s.k] == null) { pen = false; continue; } d += `${pen ? "L" : "M"}${X(p[0]).toFixed(1)} ${Y(Math.min(yMax, Math.max(yMin, p[s.k]))).toFixed(1)}`; pen = true; }
    if (s.area && d) g += `<path d="${d} L${X(t1).toFixed(1)} ${Y(yMin)} L${L} ${Y(yMin)} Z" fill="${s.c}" opacity=".18"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}</svg>`;
}

  const pts = [], now = Math.floor(Date.now() / 1000);

    const pv = h >= 8 && h <= 16 ? Math.round(320 * Math.sin((h - 8) / 8 * Math.PI) * (0.6 + 0.4 * Math.sin(t / 50000))) : 0;
    pts.push([t, Math.round(60 + 25 * Math.sin((t - now) / 86400 * 2 * Math.PI)), pv, 40 + Math.round(30 * Math.random()), null, null]); }
  const days = []; for (let k = 6; k >= 0; k--) days.push({day: new Date(Date.now() - k * DAYMS).toISOString().slice(0, 10), pv_wh: 900 + k * 120, load_wh: 1400 - k * 50, grid_wh: 0, min_soc: 52 + k});
  HISTD["7d"] = {range: "7d", pts, days}; HISTD["24h"] = {range: "24h", pts: pts.slice(-48), days};

function demoExtrasCmd(m){
  const t = m.type || "";
  if (t === "chk_toggle") CHK.items[m.i].done = !CHK.items[m.i].done;
  else if (t === "chk_reset") CHK.items.forEach(x => x.done = false);
  else if (t === "chk_add") CHK.items.push({t: m.text, done: false});
  else if (t === "chk_del") CHK.items.splice(m.i, 1);
  else if (t === "mt_done") { const x = MAINT.find(x => x.id === m.id); x.left = x.months * 30; x.last = new Date().toISOString().slice(0, 10); }
  else if (t === "mt_shift") { const x = MAINT.find(x => x.id === m.id); x.left = (x.left ?? 0) + 30 * m.months; }
  else if (t === "mt_del") MAINT = MAINT.filter(x => x.id !== m.id);
  else if (t === "mt_add") MAINT.push({id: "n" + Date.now(), name: m.name, months: m.months, due: null, left: null});
  else if (t === "energy_set") { if (m.pv_wp) FC.pv_wp = m.pv_wp; if (m.battery_wh) FC.cap_wh = m.battery_wh; }
  else if (t === "history" || t === "net_info" || t === "warn_cfg") {}
  else if (t === "warn_set") { if (m.key === "toggle") { const o = new Set(WCFG.off); o.has(m.value) ? o.delete(m.value) : o.add(m.value); WCFG.off = [...o]; } else WCFG[m.key] = m.value; }
  else if (t === "loc_search") setTimeout(() => exMessage({type: "loc_results", results: [{name: "Issum", detail: "Kreis Kleve, Nordrhein-Westfalen, Deutschland", lat: 51.5389, lon: 6.4238}]}), 600);
  else if (t === "loc_set") { WX.loc = {lat: m.lat, lon: m.lon, src: "manuell", src_txt: "fest gewählt", manual: true}; WX.loc_source = "manuell"; }
  else if (t === "trip_here") TRIP.stays.push({id: "h" + Date.now(), place: PLACE, lat: 51.52, lon: 6.33, t: Date.now() / 1000, until: null});
  else if (t === "trip_del") TRIP.stays = TRIP.stays.filter(s => s.id !== m.id);
  else if (t === "trip_get") mapDraw();
  else return false;
  return true;
}

function lgMessage(m){
  if (m.type === "lights") { LG = m; if (LG_SEL && !LG.lights.some(l => l.id === LG_SEL)) LG_SEL = null; }
  else if (m.type === "shelly_scan") { LG_SCAN = {busy: m.busy, found: m.found || [], searched: m.searched || LG_SCAN.searched}; }
  else return false;
  if (LG_EDIT.open) lgEditDraw();
  return true;
}
function lgLight(id){ return LG && LG.lights.find(l => l.id === id); }

function lgAction(cmd, p){
  if (cmd === "lg") {
    const l = lgLight(p[0]); if (!l) return true;
    LG_SEL = l.dim ? l.id : LG_SEL;
    l.on = !l.on;                       // sofort zeigen, Server bestätigt
    send({type: "light_set", id: l.id, on: l.on});
    return true;
  }
  if (cmd === "lgsel") { LG_SEL = p[0]; return true; }
  if (cmd === "lgscene") { send({type: "light_scene", scene: p[0]}); return true; }
  if (cmd === "lgstep") { const l = lgLight(LG_SEL); if (l) { l.bri = Math.max(1, Math.min(100, (l.bri || 100) + Number(p[0]))); l.on = true; send({type: "light_set", id: l.id, on: true, bri: l.bri}); } return true; }
  if (cmd === "lgedit") { LG_EDIT.open = p[0] !== "close"; if (LG_EDIT.open && !LG_EDIT.id && LG) LG_EDIT.id = LG.lights[0] && LG.lights[0].id; if (!LG_EDIT.open) oskHide(); lgEditDraw(); return true; }
  if (cmd === "lgpick") { LG_EDIT.id = p[0]; lgEditDraw(true); return true; }
  if (cmd === "lgzone") { send({type: "light_edit", id: LG_EDIT.id, zone: p[0]}); return true; }
  if (cmd === "lgdim") { const l = lgLight(LG_EDIT.id); if (l) send({type: "light_edit", id: l.id, dim: !l.dim}); return true; }
  if (cmd === "lgassign") {
    if (p[0] === "none") send({type: "light_edit", id: LG_EDIT.id, host: "", ch: 0, kind: "auto"});
    else send({type: "light_edit", id: LG_EDIT.id, host: p[0], ch: Number(p[1]), kind: p[2], dim: p[2] !== "switch"});
    return true;
  }
  if (cmd === "lgscan") { LG_SCAN.busy = true; send({type: "shelly_scan"}); lgEditDraw(); return true; }
  if (cmd === "lgadd") { send({type: "light_add", name: "Neues Licht", zone: "decke"}); return true; }
  if (cmd === "lgdel") { send({type: "light_del", id: LG_EDIT.id}); LG_EDIT.id = null; return true; }
  return false;
}

const LG_SCENE_IC = {aus: "⏻", hell: "☀️", abend: "🌅", nacht: "🌙", ankommen: "🏠"};
function lgGlowDraw(){
  if (!LG) return;
  const used = {};
  html("lgGlow", LG.lights.map(l => {
    const [cx, cy] = LG_ZPOS[l.zone] || [570, 240];
    const k = used[l.zone] = (used[l.zone] ?? -1) + 1;
    if (!l.on || l.zone === "aussen") return "";
    const x = cx + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (BW + 10);
    const a = l.dim ? Math.max(.15, (l.bri ?? 100) / 100) : 1;
    return `<circle cx="${x}" cy="${cy}" r="${150 + 60 * a}" fill="url(#lgWarm)" opacity="${a.toFixed(2)}"/>`;
  }).join(""));
}
function lgBtnsDraw(){
  lgGlowDraw();
  if (!LG) { html("lgBtns", `<div class="empty" style="position:absolute;left:400px;top:200px">Lade Lichter ...</div>`); return; }
  const used = {};
  html("lgBtns", LG.lights.map(l => {
    const [cx, cy] = LG_ZPOS[l.zone] || [570, 240];
    const k = used[l.zone] = (used[l.zone] ?? -1) + 1;
    const out = l.zone === "aussen", h = out ? 58 : BH;
    const x = Math.round(cx - BW / 2 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (BW + 10)), y = Math.round(cy - h / 2);
    const on = l.on, sel = l.id === LG_SEL;
    const st = !on ? "AUS" : l.dim ? `${l.bri ?? 100} %` : "AN";
    return `<button class="lgBtn ${on ? "on" : ""} ${sel ? "sel" : ""} ${out ? "out" : ""}" style="left:${Math.max(0, Math.min(1144 - BW, x))}px;top:${Math.max(0, y)}px;--glow:${on ? (0.25 + 0.5 * (l.dim ? (l.bri ?? 100) / 100 : 1)).toFixed(2) : 0}" data-tap="lg|${l.id}">
      ${bulb(on)}<span class="lgN">${esc(l.name)}</span><span class="lgS">${st}${l.virtual ? " · ohne Shelly" : !l.ok ? " · ⚠" : ""}</span></button>`;
  }).join(""));
}

async function vcUi(m){

  if (m.do === "page") show(m.page);
  else if (m.do === "night") { night = !!m.on; applyNight(); }
  else if (m.do === "timer") { TIMER.running = false; TIMER.remain = m.seconds; clockAction("tm", "start"); }
  else if (m.do === "radio_vol") radioAction("vol", m.value);

      if (!RADIO.list.length) await radioLoad(RADIO.favs.length ? "fav" : "top");
      const s = RADIO.playing || RADIO.favs[0] || RADIO.list[0];

}
function vcAction(cmd, p){

  else if (a === "setup") send({type: "voice_setup"});

  else if (a === "speak") send({type: "voice_speak", on: p[1] === "1"});

// An Bildschirm anpassen: 1280 breit, Höhe passt sich dem Format an
// (16:9 -> 720, 7"-1024×600 -> 750, 10,1" 16:10 -> 800)
function fit(){
  const H = Math.max(720, Math.min(820, Math.round(1280 * innerHeight / innerWidth)));
  const s = Math.min(innerWidth / 1280, innerHeight / H);
  STAGE_S = s;
  const st = document.getElementById("stage");
  if (H !== STAGE_H) {
    STAGE_H = H; st.style.setProperty("--H", H + "px");
    const wi = document.getElementById("womoImg"); if (wi) wi.remove();       // Startseite neu aufbauen
    const lt = document.getElementById("lgBtns"); if (lt) document.getElementById("pg-licht").innerHTML = "";
    try { MAP.H = H - 160; MAP.needFit = true; } catch (e) {}
    const ex = document.getElementById("exTabs"); if (ex) document.getElementById("pg-extras").innerHTML = "";
    if (typeof schedule === "function") schedule(true);
  }
  // "zoom" statt "transform: scale" -> Schrift und Symbole werden scharf neu gezeichnet statt hochgerechnet
  if (CSS.supports("zoom", "1")) {
    st.style.transform = "";
    st.style.zoom = s;
    st.style.left = (innerWidth - 1280 * s) / 2 / s + "px";
    st.style.top = (innerHeight - STAGE_H * s) / 2 / s + "px";
  } else {
    st.style.transform = `scale(${s})`;
    st.style.left = (innerWidth - 1280 * s) / 2 + "px";
    st.style.top = (innerHeight - STAGE_H * s) / 2 + "px";
  }
}
addEventListener("resize", fit);

  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    const k = e.target.closest("[data-k]");
    if (!k) return;
    k.classList.add("down"); setTimeout(() => k.classList.remove("down"), 120);
    oskKey(k.dataset.k);
  });

}
function oskRender(){
  const el = oskEl();

  el.innerHTML = `<div class="oskBar"><span class="oskPrev">${esc(OSK.target ? OSK.target.value : "")}<i class="oskCur"></i></span>
